# Keeps the league site up to date on GitHub Pages.
# Scheduled every 15 minutes; check-games.js decides whether to actually update (every 15 minutes
# around NFL games, otherwise twice a day). GitHub fires the schedule only every few hours here, so
# on game days each run starts the next one (the "next" job), and the schedule is the backup.
name: Update league site

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      chained:
        description: Started by the previous run (not by hand)
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: league-site
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: check
        run: node check-games.js

  update:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # The latest main, not the commit that queued this run: a run that waited behind another
      # would otherwise start from stale history files
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Download the current season from ESPN
        run: node fetch.js current
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
      - name: Build the site
        run: node build.js
      - name: Write league news
        run: node news.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LEAGUE_LORE: ${{ secrets.LEAGUE_LORE }}
          LEAGUE_LORE_EXTRA: ${{ secrets.LEAGUE_LORE_EXTRA || secrets.LEAGUE_LORE_II }}
          CHAINED: ${{ inputs.chained || false }}
      - name: Post live reactions during games
        run: node live.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LEAGUE_LORE: ${{ secrets.LEAGUE_LORE }}
          LEAGUE_LORE_EXTRA: ${{ secrets.LEAGUE_LORE_EXTRA || secrets.LEAGUE_LORE_II }}
      - name: Rebuild with the latest news
        run: node build.js
      - name: Save finished seasons, live win chances and news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for d in archive history news; do if [ -d "$d" ]; then git add "$d"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "Update league history"
            git pull --rebase -X theirs origin main # on a clash, this run's newer history wins
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4

  # On game days, start the next run (see check-games.js); runs never overlap (concurrency above)
  next:
    needs: [check, update]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: next
        run: node check-games.js next
      - if: steps.next.outputs.wait != '0'
        run: sleep ${{ steps.next.outputs.wait }} && gh workflow run update.yml --ref main -f chained=true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
