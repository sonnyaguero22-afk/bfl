<title>Buckaroo League History</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: frosted top bar with segmented controls; one content column of grouped cards. Dark is the default; light only on an explicit light choice. */
:root {
  --bg: #000000;
  --surface: #1c1c1e;
  --sunk: #2c2c2e;
  --ink: #f5f5f7;
  --muted: #98989f;
  --line: #2f2f33;
  --edge: rgba(255, 255, 255, 0.07);
  --bar: rgba(22, 22, 24, 0.78);
  --seg: #636366;
  --brass: #0a84ff;          /* accent (system blue) */
  --brass-soft: rgba(10, 132, 255, 0.18);
  --gold: #ffd60a;
  --gold-soft: rgba(255, 214, 10, 0.16);
  --win: #30d158;
  --loss: #ff453a;
  --win-bg: rgba(48, 209, 88, 0.16);
  --loss-bg: rgba(255, 69, 58, 0.16);
  --heat-hi: #0a84ff;
  --heat-lo: #1c1c1e;
  --pos-QB: #ff6961; --pos-RB: #30d158; --pos-WR: #64a8ff; --pos-TE: #ff9f0a; --pos-K: #bf5af2; --pos-DST: #8e8e93;
  --mgr-s: 62%; --mgr-l: 68%;
  --f-display: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --f-body: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --f-mono: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f5f5f7; --surface: #ffffff; --sunk: #f2f2f5; --ink: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea;
  --edge: rgba(0, 0, 0, 0.06); --bar: rgba(255, 255, 255, 0.78); --seg: #ffffff;
  --brass: #007aff; --brass-soft: rgba(0, 122, 255, 0.12); --gold: #b8860b; --gold-soft: rgba(184, 134, 11, 0.13);
  --win: #248a3d; --loss: #d70015; --win-bg: rgba(52, 199, 89, 0.15); --loss-bg: rgba(255, 59, 48, 0.12);
  --heat-hi: #79b8ff; --heat-lo: #ffffff;
  --pos-QB: #e5484d; --pos-RB: #2f9e55; --pos-WR: #0a6cdc; --pos-TE: #d97706; --pos-K: #8e4ec6; --pos-DST: #6e6e73;
  --mgr-s: 52%; --mgr-l: 46%; color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; letter-spacing: -0.006em; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.num, td.n, th.n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* Masthead */
header.mast { background: var(--bg); }
.mast .wrap { padding-block: 34px 18px; display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: end; justify-content: space-between; }
.brand { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.brand small { font-size: 13px; color: var(--muted); font-weight: 500; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(30px, 5vw, 41px); line-height: 1.05; letter-spacing: -0.03em; text-wrap: balance; }
.brand h1 span { color: inherit; }
/* Segmented control */
.themebtn { margin-left: 8px; background: var(--sunk); border: 0; color: var(--muted); border-radius: 999px; padding: 2px 9px; font: inherit; font-size: 11px; cursor: pointer; vertical-align: 1px; }
.themebtn:hover { color: var(--ink); }
nav.top { display: flex; flex-wrap: wrap; gap: 2px; background: var(--sunk); padding: 3px; border-radius: 10px; max-width: 100%; }
nav.top button { background: transparent; border: 0; color: var(--ink); padding: 6px 13px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; }
nav.top button:hover { background: var(--edge); }
nav.top button[aria-current="true"] { background: var(--seg); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.25), 0 0 0 .5px rgba(0,0,0,.08); }

/* Season rail: frosted, sticky */
.rail { background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.rail .wrap { display: flex; gap: 4px; overflow-x: auto; padding-block: 9px; scrollbar-width: none; align-items: center; }
.rail .lbl { font-size: 13px; color: var(--muted); margin-right: 8px; white-space: nowrap; font-weight: 500; }
.yr { border: 0; background: transparent; padding: 5px 14px; border-radius: 999px; cursor: pointer; font-family: var(--f-body); font-weight: 600; font-size: 14px; color: var(--ink); white-space: nowrap; display: flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
.yr em { font-style: normal; font-size: 10.5px; font-weight: 600; color: var(--loss); }
.yr:hover { background: var(--sunk); }
.yr[aria-current="true"] { background: var(--brass); color: #fff; }
.yr[aria-current="true"] em { color: #fff; }
.yr.locked { opacity: .45; }

main { padding-block: 28px 64px; }
.vhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px 24px; margin-bottom: 20px; }
.vhead h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(26px, 4vw, 36px); line-height: 1.1; text-wrap: balance; }
.vhead p { margin: 4px 0 0; color: var(--muted); }
.eyebrow { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--brass); font-weight: 700; }
h3 { font-family: var(--f-display); font-weight: 400; font-size: 20px; margin: 0 0 12px; }
section + section, .bowls + section { margin-top: 36px; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 22px; overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; cursor: pointer; font-weight: 600; color: var(--muted); white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-current="true"] { color: var(--ink); border-color: var(--brass); }

.box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
th.n, td.n { text-align: right; }
tr.cut td { border-bottom: 2px dashed var(--brass); }
.team { display: flex; gap: 10px; align-items: center; min-width: 180px; }
.team b { font-weight: 600; display: block; line-height: 1.2; }
.team small { color: var(--muted); font-size: 12px; }
.badge { flex: none; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 600; font-size: 10.5px; color: var(--surface); background: hsl(var(--h) var(--mgr-s) var(--mgr-l)); letter-spacing: -.02em; }
.badge.sm { width: 22px; height: 22px; border-radius: 6px; font-size: 9px; }
a.mlink, button.mlink { color: inherit; text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
a.mlink:hover b, button.mlink:hover b, button.mlink:hover { text-decoration: underline; text-decoration-color: var(--brass); text-underline-offset: 3px; }
.w { color: var(--win); font-weight: 600; } .l { color: var(--loss); font-weight: 600; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .04em; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.gold { background: var(--brass-soft); color: var(--brass); }
.pill.live { background: var(--loss-bg); color: var(--loss); }
.pill.w { background: var(--win-bg); } .pill.l { background: var(--loss-bg); }
.muted { color: var(--muted); }
.note { color: var(--muted); font-size: 13px; margin-top: 10px; }

/* Summary strip */
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 28px; }
.stat { padding: 14px 16px; }
.stat .k { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.stat .v { font-family: var(--f-display); font-size: 22px; line-height: 1.2; margin-top: 4px; }
.stat .s { font-size: 13px; color: var(--muted); }

/* Heatmap */
.heat td.c { text-align: center; font-family: var(--f-mono); font-size: 12.5px; padding: 8px 6px; min-width: 52px; }
.heat td.c.hi { box-shadow: inset 0 0 0 2px var(--brass); font-weight: 700; }
.legend { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend i { width: 80px; height: 10px; border-radius: 3px; background: linear-gradient(90deg, var(--heat-lo), var(--heat-hi)); }

/* Matchups */
.weekbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.weekbar button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-family: var(--f-mono); font-size: 13px; }
.weekbar button[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.weekbar button.po { border-color: var(--brass); }
.games { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.game { padding: 0; overflow: hidden; }
.game.open { grid-column: 1 / -1; overflow: visible; } /* visible, so the score bar can stay pinned while you scroll */
.game > button { display: block; width: 100%; background: none; border: 0; padding: 12px 14px; cursor: pointer; text-align: left; }
.game > button:hover { background: var(--sunk); }
.side { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 4px 0; }
.side .pts { font-family: var(--f-mono); font-size: 20px; font-weight: 600; }
.side.lost { opacity: .6; }
.gmeta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }
.lineups { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-top: 1px solid var(--line); font-size: 13px; }
.lineups > div { padding: 10px 12px; min-width: 0; }
.lineups > div + div { border-left: 1px solid var(--line); }
.pl { display: grid; grid-template-columns: 38px 1fr auto; gap: 6px; padding: 3px 0; align-items: baseline; }
.pl .slot { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); }
.pl .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl .nm small { color: var(--muted); }
.pl .p { font-family: var(--f-mono); }
.pl.bn { opacity: .62; }
.bnhead { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 8px 0 2px; border-top: 1px dashed var(--line); padding-top: 6px; display: flex; justify-content: space-between; }

/* Draft board */
.board { display: grid; gap: 4px; min-width: 900px; padding: 12px; }
.board .hd { font-size: 12px; font-weight: 600; padding: 4px; display: flex; gap: 6px; align-items: center; min-width: 0; }
.board .hd span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board .rd { font-family: var(--f-mono); font-size: 11px; color: var(--muted); display: grid; place-items: center; }
.pick { background: var(--sunk); border-radius: 6px; padding: 5px 7px; font-size: 12px; line-height: 1.25; border-left: 4px solid var(--pc, var(--line)); min-width: 0; }
.pick b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick small { color: var(--muted); font-family: var(--f-mono); font-size: 10.5px; }
.poskey { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.poskey span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; background: var(--pc); vertical-align: -1px; }

/* Trades & moves */
.trades { display: grid; gap: 12px; }
.trade { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; padding: 14px 16px; align-items: start; }
.trade .arrow { font-family: var(--f-display); color: var(--brass); font-size: 22px; align-self: center; }
.trade ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
.trade li { font-size: 14px; }
.trade .tmeta { grid-column: 1 / -1; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }
.posdot { display: inline-block; font-family: var(--f-mono); font-size: 10px; font-weight: 600; padding: 1px 5px; border-radius: 4px; color: var(--surface); background: var(--pc, var(--muted)); margin-right: 6px; vertical-align: 1px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
select { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.add { color: var(--win); font-weight: 700; } .drop { color: var(--loss); font-weight: 700; }
input[type="search"] { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); flex: 1 1 200px; min-width: 0; max-width: 320px; }
button.plink { background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; }
button.plink:hover { text-decoration: underline; text-decoration-color: var(--brass); text-underline-offset: 3px; }
ul.txl { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 2px; font-size: 13.5px; }
.pick:hover { outline: 1px solid var(--brass); }

/* Trophy room */
.bowls { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.bowl { padding: 18px; display: flex; flex-direction: column; gap: 10px; position: relative; }
.bowl .rn { font-family: var(--f-display); font-size: 40px; line-height: 1; color: var(--brass); }
.bowl .yr2 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.bowl.locked { background: transparent; border-style: dashed; }
.bowl dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; }
.bowl dt { color: var(--muted); }
.bowl dd { margin: 0; font-weight: 600; }

/* Managers */
.mgrs { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.mgr { padding: 16px; display: grid; gap: 12px; cursor: pointer; text-align: left; width: 100%; }
.mgr:hover { border-color: var(--brass); }
.mgr .top { display: flex; gap: 12px; align-items: center; }
.mgr .top b { font-family: var(--f-display); font-weight: 400; font-size: 20px; display: block; line-height: 1.1; }
.mgr .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.mgr .nums div { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.mgr .treas { font-size: 13px; font-weight: 600; margin-top: 4px; }
.mgr .nums div b { display: block; font-family: var(--f-mono); font-size: 16px; color: var(--ink); letter-spacing: 0; text-transform: none; }
.rings { color: var(--brass); font-size: 13px; font-weight: 700; min-height: 1.2em; }

/* H2H */
.h2h td.c { text-align: center; font-family: var(--f-mono); font-size: 13px; white-space: nowrap; }
.h2h td.self { background: var(--sunk); }
.h2h td.up { background: var(--win-bg); } .h2h td.dn { background: var(--loss-bg); }

/* Records */
.recs { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.rec { padding: 16px; display: grid; gap: 10px; align-content: start; }
.rec .k { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.rec .big { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.rec .big .v { font-family: var(--f-display); font-size: 30px; line-height: 1; color: var(--brass); }
.rec .who { font-weight: 600; }
.rec .ctx { font-size: 12.5px; color: var(--muted); }
.rec ol { margin: 0; padding: 8px 0 0; list-style: none; border-top: 1px solid var(--line); display: grid; gap: 3px; font-size: 13px; counter-reset: r 1; }
.rec ol li { display: flex; justify-content: space-between; gap: 8px; counter-increment: r; }
.rec ol li::before { content: counter(r); font-family: var(--f-mono); color: var(--muted); width: 1.4em; flex: none; }
.rec ol li span:first-of-type { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.lockcard { padding: 28px; border-style: dashed; background: transparent; max-width: 640px; }
.lockcard h3 { margin-bottom: 6px; }
footer { color: var(--muted); font-size: 12px; padding-block: 0 40px; }

@media (max-width: 560px) {
  .lineups { grid-template-columns: 1fr; }
  .lineups > div + div { border-left: 0; border-top: 1px solid var(--line); }
  .trade { grid-template-columns: 1fr; }
  .trade .arrow { transform: rotate(90deg); justify-self: start; }
  .games { grid-template-columns: 1fr; }
  .recs { grid-template-columns: 1fr; }
}
/* Apple-style refinements: system type, inset cards, segmented controls */
.num, td.n, th.n { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.vhead h2 { font-weight: 700; letter-spacing: -0.03em; font-size: clamp(28px, 4vw, 40px); }
h3 { font-weight: 700; letter-spacing: -0.02em; font-size: 21px; }
.eyebrow { color: var(--muted); letter-spacing: 0; text-transform: none; font-size: 13px; font-weight: 600; }
.box { border: 0; box-shadow: inset 0 0 0 1px var(--edge); border-radius: 14px; }
th { text-transform: none; letter-spacing: 0; font-size: 12.5px; font-weight: 600; }
td { border-bottom-color: var(--line); }
.stat .k, .rec .k, .bowl .yr2 { text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 600; }
.stat .v { font-weight: 700; letter-spacing: -0.025em; font-size: 24px; }
.bowl .rn { color: var(--gold); font-weight: 800; letter-spacing: -0.03em; font-size: 44px; }
.bowl.locked { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.lockcard { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.rings { color: var(--gold); }
.pill.gold { background: var(--gold-soft); color: var(--gold); }
.mgr .top b { font-weight: 700; letter-spacing: -0.02em; font-size: 19px; }
.mgr:hover { box-shadow: inset 0 0 0 1px var(--brass); }
.rec .big .v { font-weight: 700; letter-spacing: -0.03em; color: var(--ink); }
.badge { border-radius: 50%; letter-spacing: -0.03em; font-weight: 700; }
.side .pts { font-weight: 700; letter-spacing: -0.02em; }
.tabs { border-bottom: 0; background: var(--sunk); padding: 3px; border-radius: 10px; gap: 2px; display: inline-flex; max-width: 100%; }
.tabs button { border: 0; border-radius: 8px; padding: 6px 14px; font-weight: 500; color: var(--ink); font-size: 13.5px; }
.tabs button[aria-current="true"] { background: var(--seg); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.weekbar button { border: 0; background: var(--sunk); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 500; color: var(--ink); }
.weekbar button[aria-current="true"] { background: var(--brass); color: #fff; }
.weekbar button.po { box-shadow: inset 0 0 0 1px var(--gold); }
.pick { border-radius: 8px; }
select, input[type="search"] { border: 0; background: var(--sunk); border-radius: 9px; padding: 7px 11px; }
.rec li.more { display: none; }
.rec.open li.more { display: flex; }
.rec ol li > span:first-of-type { display: block; }
.rec .sub { display: block; }
.rec .big > div:first-child { min-width: 0; }
.rec .big .v { flex: none; }
.recs { grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); }
.recs > *, .strip > *, .bowls > *, .mgrs > *, .games > * { min-width: 0; }
.rec ol li > span:first-of-type { min-width: 0; overflow: hidden; }
.rec, .rec ol { grid-template-columns: minmax(0, 1fr); }
.rec .sub { font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.morebtn { justify-self: start; background: var(--sunk); border: 0; border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 600; color: var(--brass); cursor: pointer; }
.recs + .note { margin-top: 0; }
ol.bums { counter-reset: r 0; border-top: 0; padding-top: 0; }
ol.bums li { counter-increment: r; }
/* Map */
.mapwrap { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 12px; align-items: start; }
#map { height: 520px; overflow: hidden; isolation: isolate; z-index: 0; background: var(--sunk); }

// Team records through week N of the regular season (N = null means the whole regular season)
function asOf(s, N) {
  const lim = Math.min(N ?? s.regWeeks, s.regWeeks);
  const st = Object.fromEntries(s.teams.map((t) => [t.id, { t, w: 0, l: 0, tie: 0, pf: 0, pa: 0, apW: 0, apL: 0, apT: 0, high: 0, seq: [], adds: 0, trades: 0 }]));

    const x = st[id]; x.pf += p; x.pa += op;
    const r = m.win === id ? "W" : m.win === 0 ? "T" : "L";
    if (r === "W") x.w++; else if (r === "L") x.l++; else x.tie++;
    x.seq.push(r);
  }
  for (const wk in s.weekScores) {
    if (+wk > lim) continue;
    const arr = s.weekScores[wk], top = Math.max(...arr.map((x) => x[1]));
    for (const [id, p] of arr) {
      const x = st[id];
      for (const [id2, p2] of arr) if (id2 !== id) { if (p > p2) x.apW++; else if (p < p2) x.apL++; else x.apT++; }
      if (p === top) x.high++;
    }
  }
  const moveLim = N == null ? 99 : lim;
  for (const m of s.moves) if (m.wk <= moveLim) st[m.tm].adds += m.add.length;
  for (const tr of s.trades) if (tr.wk <= moveLim) for (const id of tr.teams) st[id].trades++;
  for (const x of Object.values(st)) {
    const g = x.apW + x.apL + x.apT, n = x.w + x.l + x.tie;
    x.luck = g ? x.w - ((x.apW + x.apT / 2) / g) * n : 0;
    let k = x.seq.length - 1; const last = x.seq[k]; let len = 0;
    while (k >= 0 && x.seq[k] === last) { len++; k--; }
    x.streak = last ? last + len : "";
  }
  const rows = Object.values(st);
  // Regular-season order: a finished season by its final regular-season rank; otherwise record, then
  // head-to-head among the teams tied on record, then points for (the league's tiebreakers)
  if (N == null && s.done) rows.sort((a, b) => (a.t.seed || 99) - (b.t.seed || 99));
  else {
    const share = (x, grp) => { let w = 0, n = 0; for (const m of reg) { const opp = m.h === x.t.id ? m.a : m.a === x.t.id ? m.h : null; if (opp == null || !grp.includes(opp)) continue; n++; if (m.win === x.t.id) w++; else if (m.win === 0) w += 0.5; } return n ? w / n : 0.5; };

  }

}
const recStr = (x) => `${x.w}-${x.l}${x.tie ? "-" + x.tie : ""}`;

function standings(s) {

    <option value="final">${s.done ? "Final regular season" : "Latest"}</option>${regWks.map((w) => `<option value="${w}"${N === w ? " selected" : ""}>Week ${w}</option>`).join("")}</select></div>`;

  </div>`;

  const body = rows.map((x, i) => `<tr class="${showCut && i === s.playoffTeams - 1 ? "cut" : ""}">
    <td class="n">${i + 1}</td><td>${teamCell(x.t)}</td>

    <td class="n">${x.apW}-${x.apL}</td><td class="n ${x.luck > 0.4 ? "w" : x.luck < -0.4 ? "l" : ""}">${x.luck >= 0 ? "+" : ""}${f1(x.luck)}</td>
    <td class="n">${x.high}</td><td class="n">${x.streak ? `<span class="pill ${x.streak[0] === "W" ? "w" : x.streak[0] === "L" ? "l" : ""}">${x.streak}</span>` : ""}</td><td class="n">${x.adds}</td><td class="n">${x.trades}</td></tr>`).join("");

    <p class="note">${isFinal && s.done ? `Final regular-season standings; the dashed line marks the ${s.playoffTeams}-team playoff cut. Where everyone finished after the playoffs is on the Playoffs tab.` : `Regular season through week ${lim}. Dashed line marks the ${s.playoffTeams}-team playoff cut.`} All-play is your record if you'd played every other team every week; luck is real wins minus that expectation.</p></section>`;

    ${rows.map((x) => { const t = x.t; const ps = wks.map((w) => (s.weekScores[w].find((y) => y[0] === t.id) || [0, 0])[1]); const tops = wks.map((w) => Math.max(...s.weekScores[w].map((y) => y[1])));
      return `<tr><td>${teamCell(t)}</td>${ps.map((p, i) => cell(p, p === tops[i])).join("")}<td class="n"><b>${f1(ps.reduce((a, b) => a + b, 0) / (ps.length || 1))}</b></td></tr>`; }).join("")}
    </tbody></table></div><div class="legend">Low <i></i> High · outlined = top score that week</div></section>`;

function wpRead(s, m, pts, i) {
  const q = pts[i], was = i ? pts[i - 1] : null, th = s.byId[m.h], ta = s.byId[m.a];
  const t = new Date(q[0]).toLocaleString(undefined, { weekday: "short", hour: "numeric", minute: "2-digit" });
  const home = q[1] >= 0.5, lead = home ? [th, q[1]] : [ta, 1 - q[1]], fin = i === pts.length - 1 && (q[1] === 0 || q[1] === 1 || q[1] === 0.5);
  // How far the leader's chance moved since the update before
  const mv = was ? Math.round((q[1] - was[1]) * 100) * (home ? 1 : -1) : 0;
  const plays = (q[4] || []).map(([side, nm, g, tg]) => { const k = mgrAt(side ? ta : th, m.wk);
    return `<span class="wpplay1" style="--h:${hue[k]}${gray(k)}">${tg ? `<b>${tg === "TO" ? "Turnover" : tg === "INJ" ? "🚑 Hurt" : tg}</b> ` : ""}${esc(nm)} <span class="num">${g > 0 ? "+" : ""}${f1(g)}</span></span>`; }).join("");
  return `<div class="wpline1"><span class="muted">${fin ? "Final" : t}</span>
    <span class="wpsc num">${badge(th, 1)} ${f1(q[2])} – ${f1(q[3])} ${badge(ta, 1)}</span>
    <span>${fin ? (q[1] === 0.5 ? "Tie" : `${esc(nameAt(lead[0], m.wk))} win`) : `${esc(nameAt(lead[0], m.wk))} <b>${winPct(lead[1])}</b>${mv ? ` <span class="wpmv">${mv > 0 ? "▲" : "▼"}${Math.abs(mv)}</span>` : ""}`}</span></div>${plays ? `<div class="wpplays">${plays}</div>` : ""}`;
}
// Rewinding the chart: fade what came later, move the dot and the percentages, rewrite the readout
function wpScrub(box, i) {
  const [y, wk, h, a] = box.dataset.wp.split("|").map(Number), s = S[y], m = s.matchups.find((g) => g.wk === wk && g.h === h && g.a === a);
  const pts = s.wp[`${wk}-${h}-${a}`], n = pts.length, { W, L, R, T, B, H } = WPC;
  i = Math.max(0, Math.min(n - 1, i));
  const x = L + (i * (W - L - R)) / (n - 1), yy = T + (1 - pts[i][1]) * (H - T - B), end = i === n - 1;
  const svg = box.querySelector("svg"), set = (sel, at) => { const el = svg.querySelector(sel); for (const k in at) el.setAttribute(k, at[k]); return el; };
  set(".wpfuture", { x, width: W - R - x });
  set(".wpcur", { x1: x, x2: x }).style.display = end ? "none" : "";
  set(".wpdot", { cx: x, cy: yy });
  svg.querySelector(".wph").textContent = winPct(pts[i][1]); svg.querySelector(".wpa").textContent = winPct(1 - pts[i][1]);
  box.querySelector(".wpread").innerHTML = wpRead(s, m, pts, i);
}

// ---------- Laboon, the manager ratings (Elo): every finished game since 2023, in order ----------
// Backtested on 2023-25 (136 games): wins only beat margin-weighted, K 24 beat 8 to 48, and pulling
// ratings halfway back to average each season beat keeping them. It picks 58% of winners (Brier 0.246),
// so it measures who has been best over time, not who wins next week; Luffy does that.
const ELO = (() => {
  const K = 24, PO = 1.5, CARRY = 0.5, r = {}, hist = {}, steps = [];
  const get = (k) => r[k] ?? 1500;
  let y0 = null;
  for (const s of D.seasons) for (const m of [...s.played].sort((a, b) => a.wk - b.wk)) {
    if (s.year !== y0) { for (const k in r) r[k] = 1500 + (r[k] - 1500) * CARRY; y0 = s.year; }
    const h = mgrAt(s.byId[m.h], m.wk), a = mgrAt(s.byId[m.a], m.wk);
    const e = 1 / (1 + 10 ** ((get(a) - get(h)) / 400)), sc = m.win === m.h ? 1 : m.win === 0 ? 0.5 : 0;
    const d = K * (m.tier === "WINNERS_BRACKET" ? PO : 1) * (sc - e);
    let i = steps.findIndex((x) => x.y === s.year && x.wk === m.wk);
    if (i < 0) { steps.push({ y: s.year, wk: m.wk, po: m.tier && m.tier !== "NONE" }); i = steps.length - 1; }
    // The "No manager" placeholder plays at 1500 and isn't rated
    const pre = { [h]: get(h), [a]: get(a) };
    for (const [k, o, dd, won, pts, op] of [[h, a, d, sc, m.hp, m.ap], [a, h, -d, 1 - sc, m.ap, m.hp]]) {
      if (k === "nomanager") continue;
      r[k] = pre[k] + dd;
      (hist[k] = hist[k] || []).push({ i, y: s.year, wk: m.wk, pre: pre[k], r: r[k], d: dd, opp: o, won, pts, op, oppR: pre[o] });
    }
  }
  return { r, hist, steps };
})();

const ER = { W: 800, H: 300, L: 58, R: 16, T: 14, B: 34 };
function eloChart() {
  const { W, H, L, R, T, B } = ER, n = ELO.steps.length, focus = state.eloFocus;

function records() {
  // Year filter: all-time by default, or one season
  const Y = state.recYear && S[state.recYear] ? +state.recYear : null, inY = (y) => !Y || y === Y;
  const SS = D.seasons.filter((s) => inY(s.year));
  const all = games.filter((x) => x.span === 1 && inY(x.year)); // two-week playoff rounds would swamp single-week records
  const top = (arr, f, n = 25) => [...arr].sort(f).slice(0, n);
  const ctx = (x) => `${x.year} wk ${x.wk} vs ${esc(x.oppNm)}`;
  const tn = (x) => `${esc(x.nm)} <span class="muted">(${esc(D.managers[x.mgr].first)}${x.kick ? "*" : ""})</span>`;
  const tmn = (t) => `${esc(t.name)} <span class="muted">(${t.eras ? t.eras.map((e) => esc(D.managers[e.mgr].first)).join(" / ") : esc(D.managers[t.mgr].first)})</span>`;
  const wins = all.filter((x) => x.won);
  const seasonsT = SS.flatMap((s) => s.teams.map((t) => ({ s, t })));
  const gp = (t) => t.w + t.l + t.t;
  const soFar = (x) => (x.s.done ? "" : " so far");
  // Bench and single-player weeks, only weeks that counted in a finished game
  const inGame = (s, wk, id) => { const mp = s.sp2mp[wk] ?? wk; return s.played.some((m) => m.wk === mp && (m.h === +id || m.a === +id)); };
  const bench = [], perf = [];
  for (const s of SS) for (const wk in s.lineups) for (const id in s.lineups[wk]) {
    if (!inGame(s, +wk, id)) continue;
    bench.push({ s, wk: +wk, t: s.byId[id], p: sum(s.lineups[wk][id].filter((p) => p.slot === "BN"), (p) => p.pts) });
    for (const p of s.lineups[wk][id]) if (p.slot !== "BN" && p.slot !== "IR") perf.push({ s, wk: +wk, t: s.byId[id], p });
  }
  const st = streaks(Y);
  // Every finished game the underdog won, with the winner's pre-game win chance
  const upsets = [];
  for (const s of SS) for (const m of s.played) {
    if (!m.a || !m.win) continue;
    const p = teamWin(s, m, m.win);
    if (p == null || p >= 0.5) continue;
    const l = m.win === m.h ? m.a : m.h;
    upsets.push({ s, m, p, w: s.byId[m.win], l: s.byId[l], ws: m.win === m.h ? m.hp : m.ap, ls: m.win === m.h ? m.ap : m.hp });
  }
  // Comebacks: the lowest live win chance a winner had once scoring began, and the most it trailed by
  // (from the in-game history, kept since week 7 of 2026)
  const comebacks = [];
  for (const s of SS) for (const m of s.played) {
    const pts = ((s.wp || {})[`${m.wk}-${m.h}-${m.a}`] || []).filter((q) => q[2] || q[3]);
    if (!m.a || !m.win || !pts.length) continue;
    const home = m.win === m.h, p = Math.min(...pts.map((q) => (home ? q[1] : 1 - q[1])));
    if (p >= 0.5) continue;
    comebacks.push({ s, m, p, down: Math.max(0, ...pts.map((q) => (home ? q[3] - q[2] : q[2] - q[3]))), w: s.byId[m.win], l: s.byId[home ? m.a : m.h], ws: home ? m.hp : m.ap, ls: home ? m.ap : m.hp });
  }
  const when = (x) => `${x.from.year} wk ${x.from.wk} → ${x.to.year} wk ${x.to.wk}${x.active ? " · still going" : ""}`;
  const stWho = (x) => `${mgrName(x.mgr)}${x.kick ? "*" : ""} <span class="muted">(${[...x.teams].map(esc).join(" / ")})</span>`;
  const byLen = (a, b) => b.len - a.len || b.to.year - a.to.year || b.to.wk - a.to.wk;
  const group = (title, cards) => `<section><h3>${title}</h3><div class="recs">${cards.join("")}</div></section>`;
  const pills = `<div class="weekbar" style="margin:0 0 18px"><button data-recyear="all" aria-current="${!Y}">All-Time</button>${[...years].filter((y) => S[y]).map((y) => `<button data-recyear="${y}" aria-current="${Y === y}">${y}${S[y].done ? "" : " (so far)"}</button>`).join("")}</div>`;
  return `<div class="vhead"><div><div class="eyebrow">${Y ? `${Y} Season` : "All-Time"}</div><h2>Record Book</h2><p>${Y ? `Every completed game of the ${Y} season` : `Every completed game since ${D.firstYear}`}, playoffs included. Each list shows the top 25; the two-week playoff rounds from 2023 and 2024 are left out of the single-game records. An asterisk (*) marks games after a manager was kicked for inactivity.</p></div></div>${pills}
  ${group("Streaks", [
    board("Longest Winning Streak", top(st.filter((x) => x.r === "W"), byLen), (x) => `${x.len} W`, stWho, when, Y ? "Within this season. Only streaks of 3+ are listed." : "Streaks carry over between seasons. Only streaks of 3+ are listed."),
    board("Longest Losing Streak", top(st.filter((x) => x.r === "L"), byLen), (x) => `${x.len} L`, stWho, when, Y ? "Within this season. Only streaks of 3+ are listed." : "Streaks carry over between seasons. Only streaks of 3+ are listed."),
  ])}
  ${group("Single Games", [
    board("Biggest Upset", top(upsets, (a, b) => a.p - b.p), (x) => winPct(x.p), (x) => `${esc(nameAt(x.w, x.m.wk))} <span class="muted">(${esc(D.managers[mgrAt(x.w, x.m.wk)].first)}${kickedAt(x.w, x.m.wk) ? "*" : ""})</span> over ${esc(nameAt(x.l, x.m.wk))}`, (x) => `${f2(x.ws)}–${f2(x.ls)} · ${x.s.year} ${x.m.wk > x.s.regWeeks ? "playoffs" : "wk " + x.m.wk}`, "Ranked by the winner's chance to win going into the game."),
    board("Biggest Comeback", top(comebacks, (a, b) => a.p - b.p), (x) => winPct(x.p), (x) => `${esc(nameAt(x.w, x.m.wk))} <span class="muted">(${esc(D.managers[mgrAt(x.w, x.m.wk)].first)}${kickedAt(x.w, x.m.wk) ? "*" : ""})</span> over ${esc(nameAt(x.l, x.m.wk))}`, (x) => `${x.down >= 0.05 ? `Down ${f1(x.down)} at one point · ` : ""}won ${f2(x.ws)}–${f2(x.ls)} · ${x.s.year} ${x.m.wk > x.s.regWeeks ? "playoffs" : "wk " + x.m.wk}`, "Ranked by the winner's lowest live win chance once scoring began. Tracked since week 7 of 2026."),

  const news = refs.length ? `<h3 class="wikisub">In the News</h3><ol class="wikirefs">${refs.slice(0, 15).map((a) => `<li><button class="mlink" data-go="news-${a.id}">“${esc(a.title)}”</button> <span class="muted">· ${newsWhen(a)}</span></li>`).join("")}</ol>${refs.length > 15 ? `<p class="note">And ${refs.length - 15} more.</p>` : ""}` : "";
  // Infobox
  // Fantasy shorthand: 6.09 is round 6, 9th pick of the round; the full pick shows on hover
  const drafted = p.ev.filter((e) => e.type === "draft").map((e) => `${e.y}: <span title="Round ${e.rd}, pick ${e.rp} (${ordinal(e.o)} overall)">${e.rd}.${String(e.rp).padStart(2, "0")}</span> · ${esc(nameAt(e.t, 1))}`);
  const row = (k, v) => (v ? `<tr><th>${k}</th><td>${v}</td></tr>` : "");
  const info = `<aside class="infobox box"><div class="ibhead">${esc(p.n)}</div><div class="ibsub">${posTag(p.pos)} ${nfl ? esc(nfl) : esc(p.pro)}</div><table>
    ${row("NFL status", st === "r" ? "Retired" : st === "f" ? "Free agent" : nowTeam ? esc(nowTeam) : "")}
    ${row("BFL seasons", yrs(p.years))}
    ${row("Managers", p.mgrs.map((k) => `<span class="ibm">${mbadge(k, 1)} <button class="mlink" data-go="mgr-${k}">${mgrName(k)}</button></span>`).join(""))}
    ${row("Drafted", drafted.join("<br>") || "Undrafted")}
    ${((b) => (b ? row("Bounty", `<b>${berry(b)}</b> <button class="mlink" data-go="ow-bounty">📜</button>`) : ""))(bountyOf(p.n))}
    ${rings.length || aw.length ? `<tr><th colspan="2" class="ibsec">Honors</th></tr><tr><td colspan="2">${rings.map((r) => `<div class="ibh gold">🏆 <button class="mlink" data-go="bowl-${r.y}">Buckaroo Bowl ${roman(r.n)}</button> Champion <span class="muted">(${esc(r.team)})</span></div>`).join("")}${grouped.map((a) => `<div class="ibh${SHAME[a.k] ? " l" : ""}">${a.e} ${awLink(a.k)} <span class="muted">${yrs(a.ys)}</span></div>`).join("")}</td></tr>` : ""}
    <tr><th colspan="2" class="ibsec">BFL career</th></tr>
    ${row("Starts", p.starts)}
    ${row("Points as a starter", f1(p.ptsS))}
    ${row("Per start", p.starts ? f1(p.ptsS / p.starts) : "")}
    ${row("Best game", best ? `${f1(best.pts)} <span class="muted">(${best.y} wk ${best.wk})</span>` : "")}
    ${row("Bench points", p.benched ? `${f1(p.ptsB)} <span class="muted">(${p.benched} wks)</span>` : "")}
    ${row("Moves", `${p.drafts} drafted · ${p.adds} pickup${p.adds === 1 ? "" : "s"} · ${p.drops} drop${p.drops === 1 ? "" : "s"} · ${p.trades} trade${p.trades === 1 ? "" : "s"}`)}
    ${ltBlock(`p-${p.k}`)}
  </table></aside>`;
  return `<div class="wiki"><article class="wikimain">${lead}${info.replace('class="infobox box"', 'class="infobox box ibm-only"')}<h3 class="wikisub">BFL Career</h3>${career}${grouped.length ? `<h3 class="wikisub">Trophy Case</h3>${trophyCase(grouped)}` : ""}${news}</article>${info.replace('class="infobox box"', 'class="infobox box ibd-only"')}</div>`;
}

function playerView() {

  const byM = p.mgrs.map((k) => { const ws = p.weeks.filter((w) => w.mgr === k); const st = ws.filter((w) => w.start); const best = [...st].sort((a, b) => b.pts - a.pts)[0];

  <section><h3>Transaction History</h3>${timeline ? `<div class="box scroll"><table><thead><tr><th>Year</th><th>When</th><th>Move</th><th>Team</th><th>Details</th></tr></thead><tbody>${timeline}</tbody></table></div>` : `<p class="muted">No drafts, pickups, drops or trades on record.</p>`}</section>

  </tbody></table></div><p class="note">Bench and IR weeks are dimmed. Only weeks that counted in a matchup are listed.</p></section>`;

// ---------- Overrated: starts measured against ESPN's projection that week ----------
const MIN_STARTS = 5;
// Every finished start that had a projection
const STARTS = PL.flatMap((p) => p.weeks.filter((w) => w.start && w.fin && w.proj != null).map((w) => ({ p, ...w, diff: w.pts - w.proj })));
function groupStarts(keyFn) {
  const g = {};
  for (const x of STARTS) { const k = keyFn(x); (g[k] = g[k] || []).push(x); }
  return Object.values(g).filter((a) => a.length >= MIN_STARTS).map((a) => ({
    p: a[0].p, t: a[0].t, y: a[0].y, n: a.length, mgrs: [...new Set(a.map((x) => x.mgr))],
    pts: sum(a, (x) => x.pts), proj: sum(a, (x) => x.proj), diff: sum(a, (x) => x.diff), avg: sum(a, (x) => x.diff) / a.length,
  }));
}
const sgn = (n, d = 1) => (n > 0 ? "+" : n < 0 ? "−" : "") + fmtN(Math.abs(n), d);

function overratedView() {
  const career = groupStarts((x) => x.p.k);
  const seasons = groupStarts((x) => `${x.p.k}|${x.y}|${x.t.id}`);
  const top = (arr, f) => [...arr].sort(f).slice(0, 25);
  const pw = (x) => `${posTag(x.p.pos)}${pn(x.p.n)}`;
  const avgLine = (x) => `${x.n} starts · ${f1(x.pts / x.n)} a week vs ${f1(x.proj / x.n)} projected`;
  const boards = [
    board("Most Overrated Players", top(career, (a, b) => a.avg - b.avg), (x) => `${sgn(x.avg)}/wk`, pw, (x) => `${avgLine(x)} · ${firsts(x.mgrs)}`),
    board("Most Overrated Seasons", top(seasons, (a, b) => a.diff - b.diff), (x) => sgn(x.diff), pw, (x) => `${x.y} ${esc(x.t.name)} · ${avgLine(x)}`),
    board("Biggest Single-Week Flops", top(STARTS, (a, b) => a.diff - b.diff), (x) => sgn(x.diff), pw, (x) => `Projected ${f1(x.proj)}, scored ${f1(x.pts)} · ${esc(x.t.name)} · ${x.y} wk ${x.wk}`),
    board("Most Underrated Players", top(career, (a, b) => b.avg - a.avg), (x) => `${sgn(x.avg)}/wk`, pw, (x) => `${avgLine(x)} · ${firsts(x.mgrs)}`),
  ].join("");

  // Biggest bums: each team's worst starters for one season
  const ys = years.filter((y) => S[y]);
  const y = ys.includes(+state.bumYear) ? +state.bumYear : ys[ys.length - 1];
  state.bumYear = y;
  const s = S[y];
  const teamRows = groupStarts((x) => `${x.p.k}|${x.y}|${x.t.id}`).filter((x) => x.y === y);
  const cards = s.standings.map((t) => {
    const bums = teamRows.filter((x) => x.t.id === t.id).sort((a, b) => a.avg - b.avg).slice(0, 3).filter((x) => x.avg < 0);
    return `<div class="box rec"><div class="k" style="display:flex;gap:8px;align-items:center">${badge(t, 1)}<span>${esc(t.name)} <span class="muted" style="font-weight:500">· ${mgrName(t.mgr)}</span></span></div>
      ${bums.length ? `<ol class="bums">${bums.map((x) => `<li><span>${pw(x)}<small class="ctx sub">${avgLine(x)}</small></span><span class="num l">${sgn(x.avg)}/wk</span></li>`).join("")}</ol>` : `<p class="ctx" style="margin:0">No starter with ${MIN_STARTS}+ starts fell short of his projections. Clean sheet.</p>`}</div>`;
  }).join("");

  return `<div class="vhead"><div><div class="eyebrow">All-Time</div><h2>Overrated</h2><p>Every start compared with ESPN's projection for that week. Minus means he scored less than ESPN expected. Players need at least ${MIN_STARTS} starts to qualify.</p></div></div>
  <div class="recs">${boards}</div>
  <section><div class="vhead" style="margin-bottom:14px"><div><h3 style="margin:0">Biggest Bums</h3><p>Each team's three worst starters for the season, by how far below projection they scored per start.</p></div>
    <div class="weekbar" style="margin:0">${[...ys].reverse().map((yy) => `<button data-bumyear="${yy}" aria-current="${yy === y}">${yy}</button>`).join("")}</div></div>
    <div class="recs">${cards}</div>
    <p class="note">${s.done ? "" : "Season in progress, so only players who already have " + MIN_STARTS + "+ starts show up. "}Live games aren't counted until they finish.</p></section>`;
}

// ---------- Map: where everyone was each season ----------
const LOC = D.locations;
const LOC_YEARS = LOC ? Object.keys(LOC.seasons).map(Number).sort((a, b) => a - b) : [];
const placesOf = (y, k) => { const v = LOC && LOC.seasons[y] && LOC.seasons[y][k]; return v == null ? [] : [].concat(v); };
const placeLabel = (pk) => { const p = LOC.places[pk]; return `${esc(p.name)}${p.detail ? ` <span class="muted">· ${esc(p.detail)}</span>` : ""}`; };
const miles = (a, b) => { const r = (x) => (x * Math.PI) / 180; const h = Math.sin(r(b.lat - a.lat) / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(r(b.lon - a.lon) / 2) ** 2; return 2 * 3958.8 * Math.asin(Math.sqrt(h)); };
// Draw far-east places west of the US so routes cross the Pacific, not Europe
const mapped = (pk) => LOC.places[pk].lat != null; // e.g. "Boot camp" is listed but never pinned
const ll = (pk) => { const p = LOC.places[pk]; return [p.lat, p.lon > 60 ? p.lon - 360 : p.lon]; };
const mgrColor = (k) => `hsl(${hue[k]} 62% 60%)`;
const fmtMi = (n) => Math.round(n).toLocaleString() + " mi";
// Each manager's path: one stop per place, in order
function journey(k) {
  const stops = [];
  for (const y of LOC_YEARS) for (const pk of placesOf(y, k)) { const last = stops[stops.length - 1]; if (last && last.pk === pk) last.years.push(y); else stops.push({ pk, years: [y] }); }
  for (const s of stops) s.years = [...new Set(s.years)];
  return stops;
}
let mapObj = null;

// Years at a place as ranges: 2023–2025, and "2026–now" for a stint that runs into the season being played
function yearSpan(ys) {
  const live = S[lastYear] && !S[lastYear].done ? lastYear : null, out = [];
  for (const y of [...new Set(ys)].sort((a, b) => a - b)) { const r = out[out.length - 1]; if (r && y === r[1] + 1) r[1] = y; else out.push([y, y]); }
  return out.map(([a, b]) => (b === live ? `${a}–now` : a === b ? `${a}` : `${a}–${b}`)).join(", ");
}
function mapView() {
  if (!LOC) return `<p class="muted">No locations yet.</p>`;
  const sel = state.mapYear === "all" ? "all" : LOC_YEARS.includes(+state.mapYear) ? +state.mapYear : LOC_YEARS[LOC_YEARS.length - 1];
  state.mapYear = sel;
  const pills = `<div class="weekbar" style="margin:0">${[...LOC_YEARS].reverse().map((y) => `<button data-mapyear="${y}" aria-current="${sel === y}">${y}</button>`).join("")}<button data-mapyear="all" aria-current="${sel === "all"}">All Years</button></div>`;
  let side, strip;
  if (sel !== "all") {
    const who = Object.keys(LOC.seasons[sel]).filter((k) => D.managers[k]);
    const at = {};
    for (const k of who) { const ps = placesOf(sel, k); (at[ps[ps.length - 1]] = at[ps[ps.length - 1]] || []).push({ k, from: ps.length > 1 ? ps.slice(0, -1) : null }); }
    const groups = Object.entries(at).sort((a, b) => b[1].length - a[1].length);
    let far = null;
    for (let i = 0; i < who.length; i++) for (let j = i + 1; j < who.length; j++) {
      const a = placesOf(sel, who[i]).slice(-1)[0], b = placesOf(sel, who[j]).slice(-1)[0];
      if (!mapped(a) || !mapped(b)) continue;
      const d = miles(LOC.places[a], LOC.places[b]);
      if (!far || d > far.d) far = { d, a: who[i], b: who[j] };
    }
    strip = `<div class="strip">
      <div class="box stat"><div class="k">Biggest Hub</div><div class="v">${esc(LOC.places[groups[0][0]].name)}</div><div class="s">${groups[0][1].length} of ${who.length} managers</div></div>
      <div class="box stat"><div class="k">Farthest Apart</div><div class="v num">${far ? fmtMi(far.d) : "—"}</div><div class="s">${far ? `${esc(D.managers[far.a].first)} and ${esc(D.managers[far.b].first)}` : ""}</div></div>
      <div class="box stat"><div class="k">Spread Across</div><div class="v num">${groups.length} places</div><div class="s">${who.length} managers in ${sel}</div></div></div>`;
    side = groups.map(([pk, list]) => `<div class="box rec"><div class="k">${placeLabel(pk)}</div>
      <div class="maprows">${list.map((x) => `<button class="mlink team" data-go="mgr-${x.k}" style="min-width:0">${mbadge(x.k, 1)}<span><b>${mgrName(x.k)}</b>${x.from ? `<small>Earlier this season: ${x.from.map((f) => esc(LOC.places[f].name)).join(", ")}</small>` : ""}</span></button>`).join("")}</div></div>`).join("");
  } else {
    const rows = PEOPLE.map((k) => { const j = journey(k), jm = j.filter((s) => mapped(s.pk)); let d = 0; for (let i = 1; i < jm.length; i++) d += miles(LOC.places[jm[i - 1].pk], LOC.places[jm[i].pk]); return { k, j, d }; }).filter((x) => x.j.length);
    const most = [...rows].sort((a, b) => b.d - a.d)[0], stay = rows.filter((x) => x.j.length === 1);
    strip = `<div class="strip">
      <div class="box stat"><div class="k">Most Miles Moved</div><div class="v num">${fmtMi(most.d)}</div><div class="s">${esc(D.managers[most.k].first)} · ${most.j.length - 1} moves</div></div>
      <div class="box stat"><div class="k">Never Moved</div><div class="v">${stay.length}</div><div class="s">${stay.map((x) => esc(D.managers[x.k].first)).join(", ") || "Nobody"}</div></div></div>`;
    side = [...rows].sort((a, b) => b.d - a.d).map((r) => `<div class="box rec"><div class="k" style="display:flex;justify-content:space-between;gap:8px"><button class="mlink team" data-go="mgr-${r.k}" style="min-width:0">${mbadge(r.k, 1)}<b>${mgrName(r.k)}</b></button><span class="num muted">${r.d ? fmtMi(r.d) : "stayed put"}</span></div>
      <ol class="path">${r.j.map((s) => `<li><span>${placeLabel(s.pk)}</span><span class="num muted">${yearSpan(s.years)}</span></li>`).join("")}</ol></div>`).join("");
  }
  return `<div class="vhead"><div><div class="eyebrow">Around the League</div><h2>Map</h2><p>Where every manager was each season.${sel === "all" ? " Lines trace each person's moves." : ""}</p></div>${pills}</div>
  ${strip}<div class="mapwrap"><div id="map" class="box" role="img" aria-label="Map of manager locations"></div><div class="maplist">${side}</div></div>`;
}

function initMap() {
  const el = document.getElementById("map");
  if (!el) return;
  if (!window.L) { el.innerHTML = `<p class="muted" style="padding:16px">The map couldn't load right now. The list shows where everyone is.</p>`; return; }
  const light = document.documentElement.dataset.theme === "light";
  mapObj = L.map(el, { scrollWheelZoom: false, zoomSnap: 0.5 });
  // Esri's gray canvas basemap (free, no key) plus its place-name labels on top
  const esri = (name) => `https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/${name}/MapServer/tile/{z}/{y}/{x}`;
  const shade = light ? "Light" : "Dark";
  L.tileLayer(esri(`World_${shade}_Gray_Base`), { attribution: "Tiles &copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors", maxZoom: 12 }).addTo(mapObj);
  L.tileLayer(esri(`World_${shade}_Gray_Reference`), { maxZoom: 12 }).addTo(mapObj);
  const pts = [];
  const pin = (html) => L.divIcon({ className: "pin", html: `<div class="pinstack">${html}</div>`, iconSize: null });
  if (state.mapYear !== "all") {
    const y = state.mapYear, at = {};
    for (const k of Object.keys(LOC.seasons[y]).filter((k) => D.managers[k])) {
      const ps = placesOf(y, k);
      ps.forEach((pk, i) => { if (mapped(pk)) (at[pk] = at[pk] || []).push({ k, past: i < ps.length - 1 }); });
      const pm = ps.filter(mapped);
      for (let i = 1; i < pm.length; i++) L.polyline([ll(pm[i - 1]), ll(pm[i])], { color: mgrColor(k), weight: 2, dashArray: "6 6", opacity: 0.8 }).addTo(mapObj);
    }
    for (const pk in at) {
      const html = at[pk].map((x) => `<span class="${x.past ? "was" : ""}">${mbadge(x.k, 0, initials(x.k))}</span>`).join("");
      L.marker(ll(pk), { icon: pin(html), title: LOC.places[pk].name }).addTo(mapObj)
        .bindPopup(`<b>${placeLabel(pk)}</b><br>${at[pk].map((x) => `${mgrName(x.k)}${x.past ? " (earlier this season)" : ""}`).join("<br>")}`);
      pts.push(ll(pk));
    }
  } else {
    const last = {};
    for (const k of mgrKeys) {
      const j = journey(k).filter((x) => mapped(x.pk));
      if (!j.length) continue;
      if (j.length > 1) L.polyline(j.map((s) => ll(s.pk)), { color: mgrColor(k), weight: 3, opacity: 0.85 }).addTo(mapObj);
      for (const s of j.slice(0, -1)) L.circleMarker(ll(s.pk), { radius: 4, color: mgrColor(k), fillColor: mgrColor(k), fillOpacity: 1, weight: 0 }).addTo(mapObj).bindPopup(`${mgrName(k)}: ${placeLabel(s.pk)} (${yearSpan(s.years)})`);
      const end = j[j.length - 1].pk;
      (last[end] = last[end] || []).push(k);
      j.forEach((s) => pts.push(ll(s.pk)));
    }
    for (const pk in last) L.marker(ll(pk), { icon: pin(last[pk].map((k) => mbadge(k, 0, initials(k))).join("")), title: LOC.places[pk].name }).addTo(mapObj)
      .bindPopup(`<b>${placeLabel(pk)}</b><br>Now: ${last[pk].map(mgrName).join(", ")}`);
  }
  if (pts.length) mapObj.fitBounds(pts, { padding: [36, 36], maxZoom: 7 });
}

// ---------- All-time transactions ----------
const TX = D.seasons.flatMap((s) => [
  ...s.moves.map((m) => ({ s, y: s.year, wk: m.wk, o: m.date, type: m.add.length ? "add" : "drop", t: s.byId[m.tm], m })),
  ...s.trades.map((tr) => ({ s, y: s.year, wk: tr.wk - 0.5, o: 0, type: "trade", tr })),
]).sort((a, b) => b.y - a.y || b.wk - a.wk || b.o - a.o);
function txView() {
  return `<div class="vhead"><div><div class="eyebrow">All-Time</div><h2>Transactions</h2><p>Every trade, pickup and drop since ${D.firstYear}, newest first.</p></div></div>
  <div class="filters">
    <select id="txy" aria-label="Season"><option value="">All Seasons</option>${years.filter((y) => S[y]).reverse().map((y) => `<option${+state.txy === y ? " selected" : ""}>${y}</option>`).join("")}</select>
    <select id="txm" aria-label="Manager"><option value="">All Managers</option>${mgrKeys.map((k) => `<option value="${k}"${state.txm === k ? " selected" : ""}>${mgrName(k)}</option>`).join("")}</select>
    <select id="txt" aria-label="Type"><option value="">All Moves</option><option value="trade"${state.txt === "trade" ? " selected" : ""}>Trades Only</option><option value="move"${state.txt === "move" ? " selected" : ""}>Pickups &amp; Drops Only</option></select>
    <input id="txq" type="search" placeholder="Search a player" value="${esc(state.txq || "")}" aria-label="Search players">
  </div><div id="txlist">${txRows()}</div>`;
}
function txRows() {
  const q = (state.txq || "").toLowerCase().trim();
  const list = TX.filter((x) => {
    if (state.txy && x.y !== +state.txy) return false;
    if (state.txt === "trade" && x.type !== "trade") return false;
    if (state.txt === "move" && x.type === "trade") return false;
    if (state.txm && (x.type === "trade" ? !x.tr.teams.some((id) => x.s.byId[id].mgr === state.txm) : x.t.mgr !== state.txm)) return false;
    if (q) { const names = x.type === "trade" ? Object.values(x.tr.got).flat() : [...x.m.add, ...x.m.drop]; if (!names.some((n) => n.toLowerCase().includes(q))) return false; }
    return true;
  });
  const shown = list.slice(0, 300);
  const rows = shown.map((x) => {
    if (x.type === "trade") { const [a, b] = x.tr.teams.map((id) => x.s.byId[id]);
      return `<tr><td class="num">${x.y}</td><td class="num muted">Before wk ${x.tr.wk}</td><td><span class="pill gold">Trade</span></td><td>${teamCell(a)}<ul class="txl">${(x.tr.got[a.id] || []).map(plItem).join("") || "<li class=muted>—</li>"}</ul></td><td>${teamCell(b)}<ul class="txl">${(x.tr.got[b.id] || []).map(plItem).join("") || "<li class=muted>—</li>"}</ul></td></tr>`; }
    return `<tr><td class="num">${x.y}</td><td class="num muted">Wk ${x.m.wk}</td><td><span class="pill">${x.m.kind}${x.m.bid ? " $" + x.m.bid : ""}</span></td><td>${teamCell(x.t)}</td><td>${addList(x.m.add)}${x.m.add.length && x.m.drop.length ? "" : ""}${x.m.drop.length ? dropList(x.m.drop) : ""}</td></tr>`;

}

function scoreRow(s, wk, m, rec, attr) {

  const fav = teamWin(s, m, m.h), favId = fav == null ? null : fav >= 0.5 ? m.h : m.a, favP = fav == null ? null : Math.max(fav, 1 - fav);

// rowAttr(m) gives each row its click target; the followed team's game goes first, then the Bowl

// ---------- News & Social (written by Claude after each week, trade and season; see news.js) ----------
const ALL_NEWS = (D.news && D.news.articles) || [];
// Career profiles live on manager pages, not in the news feed (newest per manager)
const NEWS = ALL_NEWS.filter((a) => !["profile", "history", "rankings", "live", "bowl", "class"].includes(a.type));
// Posts made during games (live.js) live in the feed only
const LIVE = ALL_NEWS.filter((a) => a.type === "live");
// The league history (newest), shown in the trophy room
const HISTORY = ALL_NEWS.find((a) => a.type === "history");
const PROFILE = {};
for (const a of ALL_NEWS) if (a.type === "profile" && a.mgr && !PROFILE[a.mgr]) PROFILE[a.mgr] = a;
const NEWS_TYPE = { recap: "Weekly Recap", trade: "Trade", review: "Season in Review", draft: "Draft", preview: "Week Preview", final: "Final Word" };
const newsWhen = (a) => (a.type === "review" ? `${a.year} Season` : a.type === "draft" ? `${a.year} Draft` : a.type === "preview" ? `${a.year} · Week ${a.wk} Preview` : a.type === "final" ? `${a.year} · Week ${a.wk} Final Word` : a.type === "trade" ? `${a.year} · Before Week ${a.wk}` : `${a.year} · Week ${a.wk}`);
const newsCard = (a, big) => `<button class="box newscard${big ? " big" : ""}" data-go="news-${a.id}"><span class="pill${a.type === "trade" ? " gold" : ""}">${NEWS_TYPE[a.type]}</span><b>${esc(a.title)}</b><span class="dek">${esc(a.dek)}</span><small class="muted">${newsWhen(a)}</small></button>`;
const hasLogo = (t) => t && t.logo && !/\/images\/default|\/default[^/]*$/.test(t.logo);
const teamAva = (t, cls = "") => (hasLogo(t) ? `<span class="tava ${cls}"><img src="${esc(t.logo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add('nologo')">${badge(t)}</span>` : badge(t));
const avatarHue = (handle) => [...handle].reduce((x, c) => (x * 31 + c.charCodeAt(0)) % 360, 7);
// Verified accounts (league, team, reporter) get a tick and a label; team accounts use the team's badge
const OFFICIAL = { league: "League", team: "Official", reporter: "Reporter" };
const postTeam = (p, a) => p.kind === "team" && a && S[a.year] ? S[a.year].teams.find((t) => [t, ...(t.eras || [])].some((e) => e.name === p.team)) : null;
// Story and post times, in the viewer's own time zone; posts timed in the future haven't been posted yet
const stamp = (iso) => new Date(iso).toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
const posted = (p) => !p.at || new Date(p.at).getTime() <= Date.now();
// Likes, reposts and replies: from the post's heat (the writer's 1-10 for how likely it is to blow up; older
// posts get a stable stand-in) and who posted it, growing over the hours after it went up
const seed = (str) => { let x = 2166136261; for (const c of str) x = Math.imul(x ^ c.charCodeAt(0), 16777619) >>> 0; return x / 4294967296; };
const REACH = { league: 400, team: 220, reporter: 300, pundit: 90, fan: 18 };
// Heat, not follower count, decides what blows up: a big account only adds a little, official accounts (league, teams,
// reporters) do steady numbers but never go viral, and it's the trolls and hot takes at 8+ that take off
function buzz(p) {
  const r = seed(p.handle + p.text), r2 = seed(p.text + p.handle);
  const heat = Math.min(p.heat || (r2 < 0.06 ? 8 : 1 + Math.floor(r2 * 5)), OFFICIAL[p.kind] ? 3 : 10);
  let full = (30 + 0.1 * (REACH[p.kind] || 18)) * (heat * heat) / 4 * (0.4 + 1.2 * r);
  if (heat >= 8) full *= 6 + 14 * r2; // the occasional post that takes off
  const age = p.at ? Math.max(0, (Date.now() - new Date(p.at).getTime()) / 3600e3) : 48;
  const likes = Math.round(full * (1 - Math.exp(-age / (heat >= 8 ? 4 : 1.5))));
  return { likes, reposts: Math.round(likes * (0.08 + 0.1 * r2)), replies: Math.round(likes * (heat >= 7 ? 0.25 : 0.06) * (0.5 + r)), viral: likes >= 3000 };
}
const kfmt = (n) => (n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : n >= 1e4 ? Math.round(n / 1e3) + "K" : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K" : String(n));
// The LIVE tag: only on game posts from the last few hours, while NFL games are being played
const liveNow = (a, p) => p.about !== "move" && S[a.year] && S[a.year].on && p.at && Date.now() - new Date(p.at).getTime() < 3 * 3600e3;
const postHtml = (p, a, src = a) => { const tm = postTeam(p, src), u = `data-go="u-${hkey(p.handle)}"`; return `<div class="post"><button class="pava" ${u} aria-label="${esc(p.author)}'s profile">${tm ? teamAva(tm) : `<span class="avatar" style="--h:${avatarHue(p.handle)}" aria-hidden="true">${esc((p.author.match(/[A-Za-z0-9]/) || ["?"])[0].toUpperCase())}</span>`}</button><div class="pbody"><div class="phead"><button class="plink" ${u}><b>${esc(p.author)}</b>${OFFICIAL[p.kind] ? ` <span class="tick" title="Verified">✓</span>` : ""} <span class="muted">${esc(p.handle.startsWith("@") ? p.handle : "@" + p.handle)}</span></button>${OFFICIAL[p.kind] ? ` <span class="pill gold">${OFFICIAL[p.kind]}</span>` : ""}${p.at ? ` <span class="muted">· ${stamp(p.at)}</span>` : ""}</div><p>${esc(p.text)}</p>${(() => { const b = buzz(p); return `<div class="buzz">${b.viral ? `<span class="pill gold">🔥 Viral</span>` : ""}<span>💬 ${kfmt(b.replies)}</span><span>🔁 ${kfmt(b.reposts)}</span><span>♥ ${kfmt(b.likes)}</span></div>`; })()}${a ? a.type === "live" ? `<button class="mlink postsrc" data-go="${a.year}-weekly">${liveNow(a, p) ? `<span class="pill live" style="padding:0 6px;font-size:10px">LIVE</span> ` : ""}Week ${a.wk} · ${p.about === "move" ? "Roster moves" : "Game day"}</button>` : `<button class="mlink postsrc" data-go="news-${a.id}">${newsWhen(a)} · ${esc(a.title)}</button>` : ""}</div></div>`; };
const allPosts = () => [...NEWS, ...LIVE].flatMap((a) => (a.social || []).filter(posted).map((p) => ({ p, a }))).sort((x, y) => (y.p.at || "").localeCompare(x.p.at || ""));
const newsEmpty = `<div class="box lockcard"><h3>No Stories Yet</h3><p>League news is written automatically after every finished week, every trade and every season. Stories start appearing with the first update after the news writer is switched on.</p></div>`;
const aiNote = `<p class="note">Written by Claude, an AI, from the league's data. It can get things wrong; the scores and stats elsewhere on the site are the source of truth.</p>`;
// News and Social share one header with a News | Social switch
// ---------- Social profiles: tap a name or @ in the feed. Everything comes from the posts already written ----------
const hkey = (h) => String(h).replace(/^@/, "").toLowerCase().replace(/[^a-z0-9_]/g, "");
// Followers start from the kind of account (a seeded size, so each one differs) and grow with every like it's earned
const BASE_FOLLOW = { league: 48000, team: 9000, reporter: 26000, pundit: 11000, fan: 120 };
let ACCTS = null;
function accounts() {
  if (ACCTS) return ACCTS;
  const A = {};
  for (const x of [...allPosts()].reverse()) { const k = hkey(x.p.handle); if (!k) continue;
    const u = (A[k] = A[k] || { k, posts: [], likes: 0, week: 0, kinds: {} }); u.author = x.p.author; u.handle = x.p.handle.startsWith("@") ? x.p.handle : "@" + x.p.handle;
    u.kinds[x.p.kind] = (u.kinds[x.p.kind] || 0) + 1; u.posts.push(x); const l = buzz(x.p).likes; u.likes += l;
    if (x.p.at && Date.now() - new Date(x.p.at).getTime() < 7 * 86400e3) u.week += l;

    <div class="picwrap"><div class="bracket">${r1 ? `<div class="bcol"><div class="k">${po >= 4 ? "Semifinals" : "Round 1"}</div>${r1}</div>` : ""}<div class="bcol bfinal"><div class="k">Final</div>${fin}</div>${champ}</div>

    <p class="note">Seeds use the league's tiebreakers (head-to-head, then points for). The percentage beside a team in a game is its projected chance to win that game. "With a win" and "with a loss" are playoff odds depending on next week's result. Clinches, eliminations and scenarios are exact and show as soon as one is mathematically possible; until the last three weeks they never rely on a tiebreaker.</p></section>`;

// Down the Stretch: each team's remaining schedule, how hard it is, and next week's games to root for
function stretchHtml(s) {

  const rk = Object.fromEntries(order.map((t, i) => [t.id, i + 1]));

  const hard = (id) => (rk[id] === 1 ? "Hardest" : rk[id] === n ? "Easiest" : rk[id] <= n / 2 ? `${ord(rk[id])} hardest` : `${ord(n + 1 - rk[id])} easiest`);

    const opp = x.opp.map((o) => `<span class="oppc" title="Week ${o.wk}: ${nm(o.id)}">${badge(s.byId[o.id], 1)}<small class="muted num">${o.wk}</small></span>`).join("");
    const root = st ? `<span class="muted">${st === "clinched" ? "Clinched" : "Eliminated"}</span>` : (P.rootFor[t.id] || []).slice(0, 2).map((r) => `<div>${nm(r.winner)} over ${nm(r.loser)} <span class="w num">+${r.gain % 1 ? r.gain.toFixed(1) : r.gain}</span></div>`).join("") || `<span class="muted">Nothing moves the needle</span>`;
    return `<tr><td><div class="tm">${badge(t, 1)}<span><b>${esc(t.name)}</b><small class="muted">${t.w}-${t.l}${t.t ? "-" + t.t : ""} · Playoffs ${pct1(s.odds.t[t.id].p[s.odds.t[t.id].p.length - 1])}</small></span></div></td><td class="opps-td"><div class="opps">${opp}</div></td><td class="n"><b class="num">${x.avg == null ? "—" : Math.round(x.avg)}</b><small class="muted" style="display:block">${hard(t.id)}</small></td><td class="rootc">${root}</td></tr>`;

    <p class="note">Opponent strength is the average points per game Luffy expects from a team's remaining opponents (recent weeks count more, and next lineups are folded in), so higher is harder; the small number under each opponent is the week. "Root for" lists the other games next week that move a team's playoff odds the most, with the gain in percentage points if they go that way.</p></section>`;

// A season's Playoffs tab appears once its playoffs have started

// The playoffs as played (or being played): the winners' bracket to the 🏆 Buckaroo Bowl, the consolation

function bracketHtml(s) {

    const mark = big && won ? (big === "bowl" ? "🏆 " : "") : t.final === n && s.done && big === "bum" ? "🗑️ " : "";

  const game = (m, big) => [m.h, m.a].sort((x, y) => seed(x) - seed(y)).map((id) => side(m, id, big)).join("");
  const byeCard = (b) => `<div class="bgame bye"><div class="bteam won"><span class="sd num">${seed(b.h)}</span>${badge(s.byId[b.h], 1)}<div><b>${esc(s.byId[b.h].name)}</b><small class="muted">${mgrName(s.byId[b.h].mgr)}</small></div><span></span></div><div class="bteam tbd"><span class="sd"></span><div><small class="muted">First-round bye</small></div></div></div>`;
  // One bracket: its first round (byes first, then games in seed order) and its final in a titled card
  const tree = (tier, title, cls) => {

    const placeOf = (m) => (s.done && m.win ? `${ord(Math.min(s.byId[m.h].final, s.byId[m.a].final))} Place` : "Consolation Final");
    const third = big === "bowl" ? s.matchups.find((m) => m.wk === bw && m.tier === "WINNERS_CONSOLATION_LADDER") : null;
    return `<div class="bracket">${first ? `<div class="bcol"><div class="k">${tier === "WINNERS_BRACKET" ? (s.playoffTeams >= 4 ? "Semifinals" : "Round 1") : "Consolation, Round 1"}${two(bw - 1) ? " · two-week total" : ""}</div>${first}</div>` : ""}
      <div class="bcol bfinal"><div class="k">${big === "bum" && fin && fin !== bum ? placeOf(fin) : "Final"}${fin && two(bw) ? " · two-week total" : ""}</div>${fin ? (big === "bum" ? (fin === bum ? bumCard(fin) : `<div class="bgame">${game(fin)}</div>`) : `<div class="bgame ${cls}"><div class="bowlhead"><span>${title}</span></div>${game(fin, big)}</div>`) : `<div class="bgame"><div class="bteam tbd"><span class="sd"></span><div><small class="muted">Winners of the first round</small></div></div></div>`}
      ${third ? `<div class="k" style="margin-top:6px">3rd Place</div><div class="bgame">${game(third)}</div>` : ""}</div></div>`;
  };
  const top = tree("WINNERS_BRACKET", `🏆 Buckaroo Bowl ${roman(s.year - D.firstYear + 1)}`, "bowlgame bowlbox"), bottom = tree("LOSERS_CONSOLATION_LADDER", "🗑️ Bum Bowl", "bumbox");
  if (!top && !bottom) return `<p class="muted">The playoffs haven't started.</p>`;

  return `<section style="margin:0 0 28px"><div class="playoffs"><div class="trees">${top}${bottom ? `<div class="treegap"></div>${bottom}` : ""}</div>${finish}</div>
    <p class="note">Seeds are regular-season finish. ${two(bw) || two(bw - 1) ? "Playoff rounds that season were two-week totals. " : ""}The 🗑️ Bum Bowl is the consolation game that decided last place.</p></section>`;
}
