  return `<div class="vhead"><div style="display:flex;gap:14px;align-items:center">${mbadge(k)}<div><div class="eyebrow">Manager</div><h2>${mgrName(k)}</h2>${(() => { const y = lastYear, t = S[y] && S[y].teams.find((x) => x.mgr === k), b = t && D.news && D.news.bios[y] && D.news.bios[y][t.id]; return b ? `<p class="bio"><b>${esc(t.name)}</b> · ${esc(b.bio)} <span class="muted">(after Week ${b.wk})</span></p>` : ""; })()}${(() => { const j = LOC ? journey(k) : []; return j.length ? `<p class="whereline"><button class="mlink" data-go="map">📍</button> ${j.map((s) => `${placeLabel(s.pk)} <span class="muted num">${s.years.join(", ")}</span>`).join(` <span class="muted">→</span> `)}</p>` : ""; })()}</div></div>
    <button class="pill" data-go="managers" style="border:0;cursor:pointer">← All managers</button></div>
  <div class="strip">
    <div class="box stat"><div class="k">Career Record</div><div class="v num">${r.w}-${r.l}${r.t ? "-" + r.t : ""}${hasKick(k) ? "*" : ""}</div><div class="s">${pct(r.w, r.l, r.t)} win pct · regular season</div></div>
    <div class="box stat"><div class="k">Buckaroo Bowls</div><div class="v">${r.titles.length ? "🏆".repeat(r.titles.length) : "0"}</div><div class="s">${r.titles.length ? r.titles.join(", ") : "Still hunting"}${r.pw + r.pl ? ` · playoffs ${r.pw}-${r.pl}` : ""}</div></div>
    <div class="box stat"><div class="k">Points per Game</div><div class="v num">${f1(r.ppg)}</div><div class="s">${f2(r.pf)} total</div></div>
  </div>
  ${hasKick(k) ? `<p class="note" style="margin:-16px 0 24px">* Includes games after ${esc(D.managers[k].first)} was kicked for inactivity, when the team played on without him.</p>` : ""}
  ${PROFILE[k] ? `<section class="profile" style="margin:0 0 32px"><div class="eyebrow">Career Profile</div><h3 class="headline" style="font-size:clamp(22px,3vw,28px);margin:4px 0 12px">${esc(PROFILE[k].title)}</h3><div class="artbody">${PROFILE[k].body.map((p) => `<p>${esc(p)}</p>`).join("")}</div>${aiNote}</section>` : ""}
  <section><h3>Season by Season</h3><div class="box scroll"><table><thead><tr><th>Year</th><th>Team Name</th><th class="n">Record</th><th class="n">PF</th><th class="n">PA</th><th>Finish</th></tr></thead><tbody>${seasonRows}</tbody></table></div></section>
  ${(() => { const mp = mgrPlayers(k); if (!mp.length) return "";
    const top = (f) => [...mp].sort((a, b) => f(b) - f(a)).slice(0, 5);
    const who = (x) => `${posTag(x.p.pos)}${pn(x.p.n)}`;
    return `<section><h3>Their Guys</h3><div class="recs">
      ${board("Most Loyal To", top((x) => x.wks * 1000 + x.ptsS), (x) => x.wks + " wks", who, (x) => `${x.starts} starts across ${x.years.join(", ")}`)}
      ${board("Best Starters", top((x) => x.ptsS), (x) => f1(x.ptsS), who, (x) => `${x.starts} starts`)}
      ${board("Bench Regrets", top((x) => x.ptsB), (x) => f1(x.ptsB), who, (x) => `Points scored while on the bench`)}
    </div></section>`; })()}
  <section><h3>Best and Worst Weeks</h3><div class="box scroll"><table><tbody><tr><td class="muted">Best</td><td>${gameLine(r.best)}</td></tr><tr><td class="muted">Worst</td><td>${gameLine(r.worst)}</td></tr></tbody></table></div></section>
  <section><h3>Against Everyone Else</h3><div class="box scroll"><table><thead><tr><th>Opponent</th><th class="n">Record</th><th class="n">Pts for</th><th class="n">Pts Against</th></tr></thead><tbody>
    ${opps.map((x) => `<tr><td><button class="mlink team" data-go="mgr-${x.o}">${mbadge(x.o, 1)}<b>${mgrName(x.o)}</b></button></td><td class="n ${x.w > x.l ? "w" : x.w < x.l ? "l" : ""}">${x.n ? `${x.w}-${x.l}${x.t ? "-" + x.t : ""}` : "—"}</td><td class="n">${x.n ? f2(x.pf) : ""}</td><td class="n">${x.n ? f2(x.pa) : ""}</td></tr>`).join("")}</tbody></table></div><p class="note">Includes playoff games.</p></section>`;
}

function h2h() {
  const ks = [...PEOPLE].sort((a, b) => D.managers[a].first.localeCompare(D.managers[b].first));
  const rec = (a, b) => { const g = games.filter((x) => x.mgr === a && x.oppMgr === b); const w = g.filter((x) => x.won).length, t = g.filter((x) => x.tie).length; return [w, g.length - w - t, t, g.length]; };
  return `<div class="vhead"><div><div class="eyebrow">All-Time</div><h2>Head-to-Head</h2><p>Read across: each row manager's record against each column manager. Playoff games included.</p></div></div>
  <div class="box scroll"><table class="h2h"><thead><tr><th></th>${ks.map((k) => `<th class="n" style="text-align:center">${mbadge(k, 1)}<br>${esc(D.managers[k].first)}</th>`).join("")}<th class="n">Total</th></tr></thead><tbody>
  ${ks.map((a) => { let W = 0, L = 0; const cells = ks.map((b) => { if (a === b) return `<td class="self"></td>`; const [w, l, t, n] = rec(a, b); W += w; L += l; return `<td class="c ${n && w > l ? "up" : n && w < l ? "dn" : ""}">${n ? `${w}-${l}${t ? "-" + t : ""}` : "<span class=muted>–</span>"}</td>`; }).join("");
    return `<tr><td><button class="mlink team" data-go="mgr-${a}" style="min-width:0">${mbadge(a, 1)}<b>${mgrName(a)}${hasKick(a) ? "*" : ""}</b></button></td>${cells}<td class="n"><b>${W}-${L}</b></td></tr>`; }).join("")}
  </tbody></table></div>`;
}

// Win and losing streaks per manager, carried across seasons, playoffs included
function streaks() {
  const out = [];
  for (const k of PEOPLE) {
    const g = games.filter((x) => x.mgr === k).sort((a, b) => a.year - b.year || a.wk - b.wk);
    let run = null;
    const close = (active) => { if (run && run.len >= 3) out.push({ ...run, active }); };
    g.forEach((x, i) => {
      const r = x.won ? "W" : x.tie ? "T" : "L";
      if (run && run.r === r) { run.len++; run.to = x; run.teams.add(x.nm); if (x.kick) run.kick = true; }
      else { close(false); run = r === "T" ? null : { mgr: k, r, len: 1, from: x, to: x, teams: new Set([x.nm]), kick: !!x.kick }; }
      if (i === g.length - 1) close(true);
    });
  }
  return out;
}

function records() {
  const all = games.filter((x) => x.span === 1); // two-week playoff rounds would swamp single-week records
  const top = (arr, f, n = 25) => [...arr].sort(f).slice(0, n);
  const ctx = (x) => `${x.year} wk ${x.wk} vs ${esc(x.oppNm)}`;
  const tn = (x) => `${esc(x.nm)} <span class="muted">(${esc(D.managers[x.mgr].first)}${x.kick ? "*" : ""})</span>`;
  const tmn = (t) => `${esc(t.name)} <span class="muted">(${t.eras ? t.eras.map((e) => esc(D.managers[e.mgr].first)).join(" / ") : esc(D.managers[t.mgr].first)})</span>`;
  const wins = all.filter((x) => x.won);
  const seasonsT = D.seasons.flatMap((s) => s.teams.map((t) => ({ s, t })));
  const gp = (t) => t.w + t.l + t.t;
  const soFar = (x) => (x.s.done ? "" : " so far");
  // Bench and single-player weeks, only weeks that counted in a finished game
  const inGame = (s, wk, id) => { const mp = s.sp2mp[wk] ?? wk; return s.played.some((m) => m.wk === mp && (m.h === +id || m.a === +id)); };
  const bench = [], perf = [];
  for (const s of D.seasons) for (const wk in s.lineups) for (const id in s.lineups[wk]) {
    if (!inGame(s, +wk, id)) continue;
    bench.push({ s, wk: +wk, t: s.byId[id], p: sum(s.lineups[wk][id].filter((p) => p.slot === "BN"), (p) => p.pts) });
    for (const p of s.lineups[wk][id]) if (p.slot !== "BN" && p.slot !== "IR") perf.push({ s, wk: +wk, t: s.byId[id], p });
  }
  const st = streaks();
  // Every finished game the underdog won, with the winner's pre-game win chance
  const upsets = [];
  for (const s of D.seasons) for (const m of s.played) {
    if (!m.a || !m.win) continue;
    const p = teamWin(s, m, m.win);
    if (p == null || p >= 0.5) continue;
    const l = m.win === m.h ? m.a : m.h;
    upsets.push({ s, m, p, w: s.byId[m.win], l: s.byId[l], ws: m.win === m.h ? m.hp : m.ap, ls: m.win === m.h ? m.ap : m.hp });
  }
  const when = (x) => `${x.from.year} wk ${x.from.wk} → ${x.to.year} wk ${x.to.wk}${x.active ? " · still going" : ""}`;
  const stWho = (x) => `${mgrName(x.mgr)}${x.kick ? "*" : ""} <span class="muted">(${[...x.teams].map(esc).join(" / ")})</span>`;
  const byLen = (a, b) => b.len - a.len || b.to.year - a.to.year || b.to.wk - a.to.wk;
  const group = (title, cards) => `<section><h3>${title}</h3><div class="recs">${cards.join("")}</div></section>`;
  return `<div class="vhead"><div><div class="eyebrow">All-Time</div><h2>Record Book</h2><p>Every completed game since ${D.firstYear}, playoffs included. Each list shows the top 25; the two-week playoff rounds from 2023 and 2024 are left out of the single-game records. An asterisk (*) marks games after a manager was kicked for inactivity.</p></div></div>
  ${group("Streaks", [
    board("Longest Winning Streak", top(st.filter((x) => x.r === "W"), byLen), (x) => `${x.len} W`, stWho, when, "Streaks carry over between seasons. Only streaks of 3+ are listed."),
    board("Longest Losing Streak", top(st.filter((x) => x.r === "L"), byLen), (x) => `${x.len} L`, stWho, when, "Streaks carry over between seasons. Only streaks of 3+ are listed."),
  ])}
  ${group("Single Games", [
    board("Biggest Upset", top(upsets, (a, b) => a.p - b.p), (x) => winPct(x.p), (x) => `${esc(nameAt(x.w, x.m.wk))} <span class="muted">(${esc(D.managers[mgrAt(x.w, x.m.wk)].first)}${kickedAt(x.w, x.m.wk) ? "*" : ""})</span> over ${esc(nameAt(x.l, x.m.wk))}`, (x) => `${f2(x.ws)}–${f2(x.ls)} · ${x.s.year} ${x.m.wk > x.s.regWeeks ? "playoffs" : "wk " + x.m.wk}`, "Ranked by the winner's chance to win going into the game."),
    board("Most Points in a Week", top(all, (a, b) => b.pts - a.pts), (x) => f2(x.pts), tn, ctx),
    board("Fewest Points in a Week", top(all, (a, b) => a.pts - b.pts), (x) => f2(x.pts), tn, ctx),
    board("Biggest Blowout", top(wins, (a, b) => (b.pts - b.oppPts) - (a.pts - a.oppPts)), (x) => "+" + f2(x.pts - x.oppPts), tn, (x) => `${f2(x.pts)}–${f2(x.oppPts)} · ${ctx(x)}`),
    board("Closest Game", top(wins, (a, b) => (a.pts - a.oppPts) - (b.pts - b.oppPts)), (x) => f2(x.pts - x.oppPts), tn, (x) => `${f2(x.pts)}–${f2(x.oppPts)} · ${ctx(x)}`),
    board("Highest-Scoring Game", top(wins, (a, b) => (b.pts + b.oppPts) - (a.pts + a.oppPts)), (x) => f2(x.pts + x.oppPts), (x) => `${esc(x.tm.name)} vs ${esc(x.opp.name)}`, (x) => `${f2(x.pts)}–${f2(x.oppPts)} · ${x.year} wk ${x.wk}`),
    board("Most Points in a Loss", top(all.filter((x) => !x.won && !x.tie), (a, b) => b.pts - a.pts), (x) => f2(x.pts), tn, (x) => `Lost to ${f2(x.oppPts)} · ${ctx(x)}`),
    board("Fewest Points in a Win", top(wins, (a, b) => a.pts - b.pts), (x) => f2(x.pts), tn, (x) => `Opponent scored ${f2(x.oppPts)} · ${ctx(x)}`),
  ])}
  ${group("Players", [
    board("Most Points by a Player in a Week", top(perf, (a, b) => b.p.pts - a.p.pts), (x) => f1(x.p.pts), (x) => `${posTag(x.p.pos)}${pn(x.p.n)}`, (x) => `Started by ${esc(x.t.name)} · ${x.s.year} wk ${x.wk}`),
    board("Best Pickups", [...PICKUPS].sort((a, b) => b.pts - a.pts).slice(0, 25), (x) => f1(x.pts), pickupWho, pickupSub, `Undrafted players, counting only their starts for the team that picked them up (${PICKUP_MIN_STARTS}+ starts).`),
    board("Best Pickups, Points per Start", [...PICKUPS].sort((a, b) => b.ppg - a.ppg).slice(0, 25), (x) => f1(x.ppg), pickupWho, pickupSub, `Same rules: undrafted, ${PICKUP_MIN_STARTS}+ starts after the pickup.`),
    board("Most Points Left on the Bench", top(bench, (a, b) => b.p - a.p), (x) => f1(x.p), (x) => tmn(x.t), (x) => `${x.s.year} wk ${x.wk}`),
  ])}
  ${group("Seasons", [
    board("Best Regular-Season Record", top(seasonsT.filter((x) => gp(x.t)), (a, b) => (b.t.w + b.t.t / 2) / gp(b.t) - (a.t.w + a.t.t / 2) / gp(a.t) || b.t.pf - a.t.pf), (x) => `${x.t.w}-${x.t.l}${x.t.t ? "-" + x.t.t : ""}`, (x) => tmn(x.t), (x) => `${x.s.year}${soFar(x)}`),
    board("Most Points per Game, Season", top(seasonsT.filter((x) => gp(x.t)), (a, b) => b.t.pf / gp(b.t) - a.t.pf / gp(a.t)), (x) => f1(x.t.pf / gp(x.t)), (x) => tmn(x.t), (x) => `${x.s.year} · ${x.t.w}-${x.t.l}${soFar(x)}`),
    board("Most Adds, Season", top(seasonsT, (a, b) => b.t.adds - a.t.adds), (x) => x.t.adds, (x) => tmn(x.t), (x) => `${x.s.year}${soFar(x)}`),
  ])}`;
}

// ---------- Players ----------
const pWho = (p) => `${posTag(p.pos)}${pn(p.n)}`;
const firsts = (ks) => ks.map((k) => esc(D.managers[k].first)).join(", ");
function topMgr(p, f) { const c = {}; for (const w of p.weeks.filter(f)) c[w.mgr] = (c[w.mgr] || 0) + 1; const k = Object.keys(c).sort((a, b) => c[b] - c[a])[0]; return k ? D.managers[k].first : "—"; }
const PSORT = { ptsS: ["Points as a Starter", (p) => p.ptsS], ptsB: ["Points on the Bench", (p) => p.ptsB], wks: ["Weeks Rostered", (p) => p.wks], mgrs: ["Managers", (p) => p.mgrs.length], moves: ["Times Moved", (p) => p.adds + p.drops + p.trades], name: ["Name", null] };
function playersView() {
  const by = (f, n = 5) => [...PL].sort((a, b) => f(b) - f(a)).slice(0, n);
  const boards = [
    board("League MVPs", by((p) => p.ptsS), (p) => f1(p.ptsS), pWho, (p) => `${p.starts} starts for ${firsts(p.mgrs)}`),
    board("Bench Legends", by((p) => p.ptsB), (p) => f1(p.ptsB), pWho, (p) => `${p.benched} weeks on the bench, mostly ${topMgr(p, (w) => w.slot === "BN")}'s`),
    board("Most Traveled", by((p) => p.mgrs.length * 1000 + p.wks), (p) => p.mgrs.length, pWho, (p) => `Rostered by ${firsts(p.mgrs)}`),
    board("Waiver-Wire Yo-Yo", by((p) => p.adds + p.drops), (p) => p.adds + p.drops, pWho, (p) => `${p.adds} pickups, ${p.drops} drops`),
  ].join("");
  const favs = PEOPLE.map((k) => { const mp = mgrPlayers(k); if (!mp.length) return "";
    const fav = [...mp].sort((a, b) => b.wks - a.wks || b.ptsS - a.ptsS)[0], reg = [...mp].sort((a, b) => b.ptsB - a.ptsB)[0], mvp = [...mp].sort((a, b) => b.ptsS - a.ptsS)[0];
    return `<tr><td><button class="mlink team" data-go="mgr-${k}" style="min-width:0">${mbadge(k, 1)}<b>${mgrName(k)}</b></button></td>
      <td>${pWho(fav.p)} <span class="muted num">${fav.wks} wks</span></td><td>${pWho(mvp.p)} <span class="muted num">${f1(mvp.ptsS)}</span></td><td>${pWho(reg.p)} <span class="muted num">${f1(reg.ptsB)}</span></td></tr>`; }).join("");
  return `<div class="vhead"><div><div class="eyebrow">All-Time</div><h2>Players</h2><p>Every NFL player who has been on a Buckaroo roster since ${D.firstYear}. Click any name for his full league history.</p></div></div>
  <div class="recs">${boards}</div>
  <section><h3>Manager Favorites</h3><div class="box scroll"><table><thead><tr><th>Manager</th><th>Most Loyal To</th><th>Best Starter</th><th>Biggest Bench Regret</th></tr></thead><tbody>${favs}</tbody></table></div>
  <p class="note">Most loyal = most weeks on their roster. Best starter = most points scored in their starting lineup. Bench regret = most points scored while sitting on their bench.</p></section>
  <section><h3>Every Player</h3><div class="filters"><input id="pq" type="search" placeholder="Search a player" value="${esc(state.pq || "")}" aria-label="Search players">
    <select id="ppos" aria-label="Position"><option value="">All Positions</option>${["QB", "RB", "WR", "TE", "K", "D/ST"].map((p) => `<option${state.ppos === p ? " selected" : ""}>${p}</option>`).join("")}</select>
    <select id="psort" aria-label="Sort by">${Object.entries(PSORT).map(([k, [l]]) => `<option value="${k}"${(state.psort || "ptsS") === k ? " selected" : ""}>Sort: ${l}</option>`).join("")}</select></div>
  <div id="plist">${playerRows()}</div></section>`;
}
function playerRows() {
  const q = (state.pq || "").toLowerCase().trim(), sk = state.psort || "ptsS";
  let list = PL.filter((p) => (!q || p.n.toLowerCase().includes(q)) && (!state.ppos || p.pos === state.ppos));
  list = sk === "name" ? list.sort((a, b) => a.n.localeCompare(b.n)) : list.sort((a, b) => PSORT[sk][1](b) - PSORT[sk][1](a));
  const shown = list.slice(0, 150);
  return `<div class="box scroll"><table><thead><tr><th>Player</th><th>NFL</th><th>Managers</th><th class="n">Wks Rostered</th><th class="n">Starts</th><th class="n">Pts Started</th><th class="n">Pts Benched</th><th class="n">Moves</th></tr></thead><tbody>
  ${shown.map((p) => `<tr><td>${pWho(p)}</td><td class="muted">${esc(p.pro)}</td><td><span style="display:flex;gap:3px">${p.mgrs.map((k) => mbadge(k, 1)).join("")}</span></td><td class="n">${p.wks}</td><td class="n">${p.starts}</td><td class="n">${f1(p.ptsS)}</td><td class="n">${f1(p.ptsB)}</td><td class="n">${p.adds + p.drops + p.trades}</td></tr>`).join("") || `<tr><td colspan="8" class="muted">No players match that search.</td></tr>`}
  </tbody></table></div><p class="note">${list.length} player${list.length === 1 ? "" : "s"}${list.length > shown.length ? `, showing the top ${shown.length}. Search to find anyone else` : ""}.</p>`;
}
function playerView() {
  const p = P[state.pk];
  const icon = { draft: "Draft", add: "Pickup", drop: "Drop", trade: "Trade" };
  const byM = p.mgrs.map((k) => { const ws = p.weeks.filter((w) => w.mgr === k); const st = ws.filter((w) => w.start); const best = [...st].sort((a, b) => b.pts - a.pts)[0];
    return `<tr><td><button class="mlink team" data-go="mgr-${k}" style="min-width:0">${mbadge(k, 1)}<b>${mgrName(k)}</b></button></td><td class="num">${[...new Set(ws.map((w) => w.y))].join(", ") || `<span class="muted" style="font-family:var(--f-body)">Passed through in a trade</span>`}</td><td class="n">${ws.length}</td><td class="n">${st.length}</td><td class="n">${f1(sum(st, (w) => w.pts))}</td><td class="n">${f1(sum(ws.filter((w) => w.slot === "BN"), (w) => w.pts))}</td><td class="n">${best ? `${f1(best.pts)} <span class="muted">${best.y} wk ${best.wk}</span>` : "—"}</td></tr>`; }).join("");
  const timeline = p.ev.map((e) => `<tr><td class="num">${e.y}</td><td class="num muted">${e.lab}</td><td><span class="pill ${e.type === "add" ? "w" : e.type === "drop" ? "l" : e.type === "trade" ? "gold" : ""}">${icon[e.type]}</span></td><td>${teamCell(e.t)}</td><td>${esc(e.txt)}</td></tr>`).join("");
  const weeks = [...p.weeks].sort((a, b) => b.y - a.y || b.wk - a.wk);
  const best = [...p.weeks].filter((w) => w.start).sort((a, b) => b.pts - a.pts)[0];
  return `<div class="vhead"><div><div class="eyebrow">${posTag(p.pos)}${esc(p.pro)} · in the league ${p.years.join(", ")}</div><h2>${esc(p.n)}</h2></div>
    <button class="pill" data-go="players" style="border:0;cursor:pointer">← All players</button></div>
  <div class="strip">
    <div class="box stat"><div class="k">Points as a Starter</div><div class="v num">${f1(p.ptsS)}</div><div class="s">${p.starts} starts${best ? ` · best ${f1(best.pts)} (${best.y} wk ${best.wk})` : ""}</div></div>
    <div class="box stat"><div class="k">Points on the Bench</div><div class="v num">${f1(p.ptsB)}</div><div class="s">${p.benched} weeks benched</div></div>
    <div class="box stat"><div class="k">Managers</div><div class="v">${p.mgrs.length}</div><div class="s">${firsts(p.mgrs)}</div></div>
    <div class="box stat"><div class="k">Moves</div><div class="v num">${p.drafts + p.adds + p.drops + p.trades}</div><div class="s">${p.drafts} drafted · ${p.adds} pickups · ${p.drops} drops · ${p.trades} trades</div></div>
  </div>
  <section><h3>With Each Manager</h3><div class="box scroll"><table><thead><tr><th>Manager</th><th>Seasons</th><th class="n">Wks Rostered</th><th class="n">Starts</th><th class="n">Pts Started</th><th class="n">Pts Benched</th><th class="n">Best Start</th></tr></thead><tbody>${byM}</tbody></table></div></section>
  <section><h3>Transaction History</h3>${timeline ? `<div class="box scroll"><table><thead><tr><th>Year</th><th>When</th><th>Move</th><th>Team</th><th>Details</th></tr></thead><tbody>${timeline}</tbody></table></div>` : `<p class="muted">No drafts, pickups, drops or trades on record.</p>`}</section>
  <section><h3>Week by Week</h3><div class="box scroll"><table><thead><tr><th>Year</th><th class="n">NFL Wk</th><th>Team</th><th>Slot</th><th class="n">Pts</th></tr></thead><tbody>
    ${weeks.map((w) => `<tr class="${w.start ? "" : "muted"}"><td class="num">${w.y}</td><td class="n">${w.wk}</td><td>${badge(w.t, 1)} ${esc(w.t.name)}</td><td class="num">${esc(w.slot)}</td><td class="n">${f1(w.pts)}</td></tr>`).join("") || `<tr><td colspan="5" class="muted">Never in a lineup during a game week.</td></tr>`}
  </tbody></table></div><p class="note">Bench and IR weeks are dimmed. Only weeks that counted in a matchup are listed.</p></section>`;
}

// ---------- Overrated: starts measured against ESPN's projection that week ----------
const MIN_STARTS = 5;
// Every finished start that had a projection
const STARTS = PL.flatMap((p) => p.weeks.filter((w) => w.start && w.fin && w.proj != null).map((w) => ({ p, ...w, diff: w.pts - w.proj })));
function groupStarts(keyFn) {
  const g = {};
  for (const x of STARTS) { const k = keyFn(x); (g[k] = g[k] || []).push(x); }
  return Object.values(g).filter((a) => a.length >= MIN_STARTS).map((a) => ({
    p: a[0].p, t: a[0].t, y: a[0].y, n: a.length, mgrs: [...new Set(a.map((x) => x.mgr))],
    pts: sum(a, (x) => x.pts), proj: sum(a, (x) => x.proj), diff: sum(a, (x) => x.diff), avg: sum(a, (x) => x.diff) / a.length,
  }));
}
const sgn = (n, d = 1) => (n > 0 ? "+" : n < 0 ? "−" : "") + fmtN(Math.abs(n), d);

function overratedView() {
  const career = groupStarts((x) => x.p.k);
  const seasons = groupStarts((x) => `${x.p.k}|${x.y}|${x.t.id}`);
  const top = (arr, f) => [...arr].sort(f).slice(0, 25);
  const pw = (x) => `${posTag(x.p.pos)}${pn(x.p.n)}`;
  const avgLine = (x) => `${x.n} starts · ${f1(x.pts / x.n)} a week vs ${f1(x.proj / x.n)} projected`;
  const boards = [
    board("Most Overrated Players", top(career, (a, b) => a.avg - b.avg), (x) => `${sgn(x.avg)}/wk`, pw, (x) => `${avgLine(x)} · ${firsts(x.mgrs)}`),
    board("Most Overrated Seasons", top(seasons, (a, b) => a.diff - b.diff), (x) => sgn(x.diff), pw, (x) => `${x.y} ${esc(x.t.name)} · ${avgLine(x)}`),
    board("Biggest Single-Week Flops", top(STARTS, (a, b) => a.diff - b.diff), (x) => sgn(x.diff), pw, (x) => `Projected ${f1(x.proj)}, scored ${f1(x.pts)} · ${esc(x.t.name)} · ${x.y} wk ${x.wk}`),
    board("Most Underrated Players", top(career, (a, b) => b.avg - a.avg), (x) => `${sgn(x.avg)}/wk`, pw, (x) => `${avgLine(x)} · ${firsts(x.mgrs)}`),
  ].join("");

  // Biggest bums: each team's worst starters for one season
  const ys = years.filter((y) => S[y]);
  const y = ys.includes(+state.bumYear) ? +state.bumYear : ys[ys.length - 1];
  state.bumYear = y;
  const s = S[y];
  const teamRows = groupStarts((x) => `${x.p.k}|${x.y}|${x.t.id}`).filter((x) => x.y === y);
  const cards = s.standings.map((t) => {
    const bums = teamRows.filter((x) => x.t.id === t.id).sort((a, b) => a.avg - b.avg).slice(0, 3).filter((x) => x.avg < 0);
    return `<div class="box rec"><div class="k" style="display:flex;gap:8px;align-items:center">${badge(t, 1)}<span>${esc(t.name)} <span class="muted" style="font-weight:500">· ${mgrName(t.mgr)}</span></span></div>
      ${bums.length ? `<ol class="bums">${bums.map((x) => `<li><span>${pw(x)}<small class="ctx sub">${avgLine(x)}</small></span><span class="num l">${sgn(x.avg)}/wk</span></li>`).join("")}</ol>` : `<p class="ctx" style="margin:0">No starter with ${MIN_STARTS}+ starts fell short of his projections. Clean sheet.</p>`}</div>`;
  }).join("");

  return `<div class="vhead"><div><div class="eyebrow">All-Time</div><h2>Overrated</h2><p>Every start compared with ESPN's projection for that week. Minus means he scored less than ESPN expected. Players need at least ${MIN_STARTS} starts to qualify.</p></div></div>
  <div class="recs">${boards}</div>
  <section><div class="vhead" style="margin-bottom:14px"><div><h3 style="margin:0">Biggest Bums</h3><p>Each team's three worst starters for the season, by how far below projection they scored per start.</p></div>
    <div class="weekbar" style="margin:0">${[...ys].reverse().map((yy) => `<button data-bumyear="${yy}" aria-current="${yy === y}">${yy}</button>`).join("")}</div></div>
    <div class="recs">${cards}</div>
    <p class="note">${s.done ? "" : "Season in progress, so only players who already have " + MIN_STARTS + "+ starts show up. "}Live games aren't counted until they finish.</p></section>`;
}

// ---------- Map: where everyone was each season ----------
const LOC = D.locations;
const LOC_YEARS = LOC ? Object.keys(LOC.seasons).map(Number).sort((a, b) => a - b) : [];
const placesOf = (y, k) => { const v = LOC && LOC.seasons[y] && LOC.seasons[y][k]; return v == null ? [] : [].concat(v); };
const placeLabel = (pk) => { const p = LOC.places[pk]; return `${esc(p.name)}${p.detail ? ` <span class="muted">· ${esc(p.detail)}</span>` : ""}`; };
const miles = (a, b) => { const r = (x) => (x * Math.PI) / 180; const h = Math.sin(r(b.lat - a.lat) / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(r(b.lon - a.lon) / 2) ** 2; return 2 * 3958.8 * Math.asin(Math.sqrt(h)); };
// Draw far-east places west of the US so routes cross the Pacific, not Europe
const mapped = (pk) => LOC.places[pk].lat != null; // e.g. "Boot camp" is listed but never pinned
const ll = (pk) => { const p = LOC.places[pk]; return [p.lat, p.lon > 60 ? p.lon - 360 : p.lon]; };
const mgrColor = (k) => `hsl(${hue[k]} 62% 60%)`;
const fmtMi = (n) => Math.round(n).toLocaleString() + " mi";
// Each manager's path: one stop per place, in order
function journey(k) {
  const stops = [];
  for (const y of LOC_YEARS) for (const pk of placesOf(y, k)) { const last = stops[stops.length - 1]; if (last && last.pk === pk) last.years.push(y); else stops.push({ pk, years: [y] }); }
  for (const s of stops) s.years = [...new Set(s.years)];
  return stops;
}
let mapObj = null;

function mapView() {
  if (!LOC) return `<p class="muted">No locations yet.</p>`;
  const sel = state.mapYear === "all" ? "all" : LOC_YEARS.includes(+state.mapYear) ? +state.mapYear : LOC_YEARS[LOC_YEARS.length - 1];
  state.mapYear = sel;
  const pills = `<div class="weekbar" style="margin:0">${[...LOC_YEARS].reverse().map((y) => `<button data-mapyear="${y}" aria-current="${sel === y}">${y}</button>`).join("")}<button data-mapyear="all" aria-current="${sel === "all"}">All Years</button></div>`;
  let side, strip;
  if (sel !== "all") {
    const who = Object.keys(LOC.seasons[sel]).filter((k) => D.managers[k]);
    const at = {};
    for (const k of who) { const ps = placesOf(sel, k); (at[ps[ps.length - 1]] = at[ps[ps.length - 1]] || []).push({ k, from: ps.length > 1 ? ps.slice(0, -1) : null }); }
    const groups = Object.entries(at).sort((a, b) => b[1].length - a[1].length);
    let far = null;
    for (let i = 0; i < who.length; i++) for (let j = i + 1; j < who.length; j++) {
      const a = placesOf(sel, who[i]).slice(-1)[0], b = placesOf(sel, who[j]).slice(-1)[0];
      if (!mapped(a) || !mapped(b)) continue;
      const d = miles(LOC.places[a], LOC.places[b]);
      if (!far || d > far.d) far = { d, a: who[i], b: who[j] };
    }
    strip = `<div class="strip">
      <div class="box stat"><div class="k">Biggest Hub</div><div class="v">${esc(LOC.places[groups[0][0]].name)}</div><div class="s">${groups[0][1].length} of ${who.length} managers</div></div>
      <div class="box stat"><div class="k">Farthest Apart</div><div class="v num">${far ? fmtMi(far.d) : "—"}</div><div class="s">${far ? `${esc(D.managers[far.a].first)} and ${esc(D.managers[far.b].first)}` : ""}</div></div>
      <div class="box stat"><div class="k">Spread Across</div><div class="v num">${groups.length} places</div><div class="s">${who.length} managers in ${sel}</div></div></div>`;
    side = groups.map(([pk, list]) => `<div class="box rec"><div class="k">${placeLabel(pk)}</div>
      <div class="maprows">${list.map((x) => `<button class="mlink team" data-go="mgr-${x.k}" style="min-width:0">${mbadge(x.k, 1)}<span><b>${mgrName(x.k)}</b>${x.from ? `<small>Earlier this season: ${x.from.map((f) => esc(LOC.places[f].name)).join(", ")}</small>` : ""}</span></button>`).join("")}</div></div>`).join("");
  } else {
    const rows = PEOPLE.map((k) => { const j = journey(k), jm = j.filter((s) => mapped(s.pk)); let d = 0; for (let i = 1; i < jm.length; i++) d += miles(LOC.places[jm[i - 1].pk], LOC.places[jm[i].pk]); return { k, j, d }; }).filter((x) => x.j.length);
    const most = [...rows].sort((a, b) => b.d - a.d)[0], stay = rows.filter((x) => x.j.length === 1);
    strip = `<div class="strip">
      <div class="box stat"><div class="k">Most Miles Moved</div><div class="v num">${fmtMi(most.d)}</div><div class="s">${esc(D.managers[most.k].first)} · ${most.j.length - 1} moves</div></div>
      <div class="box stat"><div class="k">Never Moved</div><div class="v">${stay.length}</div><div class="s">${stay.map((x) => esc(D.managers[x.k].first)).join(", ") || "Nobody"}</div></div></div>`;
    side = [...rows].sort((a, b) => b.d - a.d).map((r) => `<div class="box rec"><div class="k" style="display:flex;justify-content:space-between;gap:8px"><button class="mlink team" data-go="mgr-${r.k}" style="min-width:0">${mbadge(r.k, 1)}<b>${mgrName(r.k)}</b></button><span class="num muted">${r.d ? fmtMi(r.d) : "stayed put"}</span></div>
      <ol class="path">${r.j.map((s) => `<li><span>${placeLabel(s.pk)}</span><span class="num muted">${s.years.join(", ")}</span></li>`).join("")}</ol></div>`).join("");
  }
  return `<div class="vhead"><div><div class="eyebrow">Around the League</div><h2>Map</h2><p>Where every manager was each season.${sel === "all" ? " Lines trace each person's moves." : ""}</p></div>${pills}</div>
  ${strip}<div class="mapwrap"><div id="map" class="box" role="img" aria-label="Map of manager locations"></div><div class="maplist">${side}</div></div>`;
}

function initMap() {
  const el = document.getElementById("map");
  if (!el) return;
  if (!window.L) { el.innerHTML = `<p class="muted" style="padding:16px">The map couldn't load right now. The list shows where everyone is.</p>`; return; }
  const light = document.documentElement.dataset.theme === "light";
  mapObj = L.map(el, { scrollWheelZoom: false, zoomSnap: 0.5 });
  // Esri's gray canvas basemap (free, no key) plus its place-name labels on top
  const esri = (name) => `https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/${name}/MapServer/tile/{z}/{y}/{x}`;
  const shade = light ? "Light" : "Dark";
  L.tileLayer(esri(`World_${shade}_Gray_Base`), { attribution: "Tiles &copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors", maxZoom: 12 }).addTo(mapObj);
  L.tileLayer(esri(`World_${shade}_Gray_Reference`), { maxZoom: 12 }).addTo(mapObj);
  const pts = [];
  const pin = (html) => L.divIcon({ className: "pin", html: `<div class="pinstack">${html}</div>`, iconSize: null });
  if (state.mapYear !== "all") {
    const y = state.mapYear, at = {};
    for (const k of Object.keys(LOC.seasons[y]).filter((k) => D.managers[k])) {
      const ps = placesOf(y, k);
      ps.forEach((pk, i) => { if (mapped(pk)) (at[pk] = at[pk] || []).push({ k, past: i < ps.length - 1 }); });
      const pm = ps.filter(mapped);
      for (let i = 1; i < pm.length; i++) L.polyline([ll(pm[i - 1]), ll(pm[i])], { color: mgrColor(k), weight: 2, dashArray: "6 6", opacity: 0.8 }).addTo(mapObj);
    }
    for (const pk in at) {
      const html = at[pk].map((x) => `<span class="${x.past ? "was" : ""}">${mbadge(x.k)}</span>`).join("");
      L.marker(ll(pk), { icon: pin(html), title: LOC.places[pk].name }).addTo(mapObj)
        .bindPopup(`<b>${placeLabel(pk)}</b><br>${at[pk].map((x) => `${mgrName(x.k)}${x.past ? " (earlier this season)" : ""}`).join("<br>")}`);
      pts.push(ll(pk));
    }
  } else {
    const last = {};
    for (const k of mgrKeys) {
      const j = journey(k).filter((x) => mapped(x.pk));
      if (!j.length) continue;
      if (j.length > 1) L.polyline(j.map((s) => ll(s.pk)), { color: mgrColor(k), weight: 3, opacity: 0.85 }).addTo(mapObj);
      for (const s of j.slice(0, -1)) L.circleMarker(ll(s.pk), { radius: 4, color: mgrColor(k), fillColor: mgrColor(k), fillOpacity: 1, weight: 0 }).addTo(mapObj).bindPopup(`${mgrName(k)}: ${placeLabel(s.pk)} (${s.years.join(", ")})`);
      const end = j[j.length - 1].pk;
      (last[end] = last[end] || []).push(k);
      j.forEach((s) => pts.push(ll(s.pk)));
    }
    for (const pk in last) L.marker(ll(pk), { icon: pin(last[pk].map((k) => mbadge(k)).join("")), title: LOC.places[pk].name }).addTo(mapObj)
      .bindPopup(`<b>${placeLabel(pk)}</b><br>Now: ${last[pk].map(mgrName).join(", ")}`);
  }
  if (pts.length) mapObj.fitBounds(pts, { padding: [36, 36], maxZoom: 7 });
}

// ---------- All-time transactions ----------
const TX = D.seasons.flatMap((s) => [
  ...s.moves.map((m) => ({ s, y: s.year, wk: m.wk, o: m.date, type: m.add.length ? "add" : "drop", t: s.byId[m.tm], m })),
  ...s.trades.map((tr) => ({ s, y: s.year, wk: tr.wk - 0.5, o: 0, type: "trade", tr })),
]).sort((a, b) => b.y - a.y || b.wk - a.wk || b.o - a.o);
function txView() {
  return `<div class="vhead"><div><div class="eyebrow">All-Time</div><h2>Transactions</h2><p>Every trade, pickup and drop since ${D.firstYear}, newest first.</p></div></div>
  <div class="filters">
    <select id="txy" aria-label="Season"><option value="">All Seasons</option>${years.filter((y) => S[y]).reverse().map((y) => `<option${+state.txy === y ? " selected" : ""}>${y}</option>`).join("")}</select>
    <select id="txm" aria-label="Manager"><option value="">All Managers</option>${mgrKeys.map((k) => `<option value="${k}"${state.txm === k ? " selected" : ""}>${mgrName(k)}</option>`).join("")}</select>
    <select id="txt" aria-label="Type"><option value="">All Moves</option><option value="trade"${state.txt === "trade" ? " selected" : ""}>Trades Only</option><option value="move"${state.txt === "move" ? " selected" : ""}>Pickups &amp; Drops Only</option></select>
    <input id="txq" type="search" placeholder="Search a player" value="${esc(state.txq || "")}" aria-label="Search players">
  </div><div id="txlist">${txRows()}</div>`;
}
function txRows() {
  const q = (state.txq || "").toLowerCase().trim();
  const list = TX.filter((x) => {
    if (state.txy && x.y !== +state.txy) return false;
    if (state.txt === "trade" && x.type !== "trade") return false;
    if (state.txt === "move" && x.type === "trade") return false;
    if (state.txm && (x.type === "trade" ? !x.tr.teams.some((id) => x.s.byId[id].mgr === state.txm) : x.t.mgr !== state.txm)) return false;
    if (q) { const names = x.type === "trade" ? Object.values(x.tr.got).flat() : [...x.m.add, ...x.m.drop]; if (!names.some((n) => n.toLowerCase().includes(q))) return false; }
    return true;
  });
  const shown = list.slice(0, 300);
  const rows = shown.map((x) => {
    if (x.type === "trade") { const [a, b] = x.tr.teams.map((id) => x.s.byId[id]);
      return `<tr><td class="num">${x.y}</td><td class="num muted">Before wk ${x.tr.wk}</td><td><span class="pill gold">Trade</span></td><td>${teamCell(a)}<ul class="txl">${(x.tr.got[a.id] || []).map(plItem).join("") || "<li class=muted>—</li>"}</ul></td><td>${teamCell(b)}<ul class="txl">${(x.tr.got[b.id] || []).map(plItem).join("") || "<li class=muted>—</li>"}</ul></td></tr>`; }
    return `<tr><td class="num">${x.y}</td><td class="num muted">Wk ${x.m.wk}</td><td><span class="pill">${x.m.kind}${x.m.bid ? " $" + x.m.bid : ""}</span></td><td>${teamCell(x.t)}</td><td>${addList(x.m.add)}${x.m.add.length && x.m.drop.length ? "" : ""}${x.m.drop.length ? dropList(x.m.drop) : ""}</td></tr>`;
  }).join("");
  const nT = list.filter((x) => x.type === "trade").length;
  return `<p class="note" style="margin:0 0 10px">${list.length} transactions · ${nT} trade${nT === 1 ? "" : "s"}${list.length > shown.length ? ` · showing the newest ${shown.length}` : ""}</p>
  <div class="box scroll"><table><thead><tr><th>Year</th><th>When</th><th>Type</th><th>Team</th><th>Players</th></tr></thead><tbody>${rows || `<tr><td colspan="5" class="muted">Nothing matches those filters.</td></tr>`}</tbody></table></div>
  <p class="note">For trades, each side lists what that team received.</p>`;
}

// ---------- Home: the latest week first, like a sports front page ----------
function home() {
  const s = S[lastYear] || D.seasons[D.seasons.length - 1];
  const n = s.year - D.firstYear + 1;
  // The week to feature: the one in progress, or the last one played
  const wk = s.done ? Math.max(...s.matchups.map((m) => m.wk)) : s.curWeek;
  const games = s.matchups.filter((m) => m.wk === wk);
  const anyLive = games.some((m) => m.live);
  const o = s.odds, oi = o ? o.weeks.length - 1 : -1;
  const odd = (id) => (o ? o.t[id].c[oi] : null);
  const rec = Object.fromEntries(asOf(s, Math.min(wk, s.regWeeks)).rows.map((x) => [x.t.id, x]));
  const wkName = wk > s.regWeeks ? (wk === Math.max(...s.matchups.map((m) => m.wk)) && s.done ? "Buckaroo Bowl " + roman(n) : "Playoffs") : `Week ${wk}`;
  const built = new Date(D.built);
  const when = built.toLocaleString(undefined, { weekday: "short", hour: "numeric", minute: "2-digit" });

  // Scoreboard
  const sbSide = (m, id, p) => { const t = s.byId[id], lost = m.win !== null && m.win !== id && m.win !== 0, lead = m.live && p > (id === m.h ? m.ap : m.hp);
    return `<div class="sbrow${lost ? " lost" : ""}">${badge(t, 1)}<span class="sbname">${esc(t.name)}<small>${rec[id] ? recStr(rec[id]) : ""}${m.win === null && teamWin(s, m, id) != null ? ` · ${winPct(teamWin(s, m, id))} to win` : ""}${toGo(m, id)}</small></span><span class="sbpts${lead ? " lead" : ""}">${f1(p)}</span></div>`; };
  const scoreCards = games.map((m) => `<button class="box sbgame" data-goweek="${s.year}|${wk}"><div class="sbtop"><span>${m.live ? `<span class="pill live">● Live</span>` : m.win !== null ? `<span class="pill">Final</span>` : `<span class="pill">Upcoming</span>`}</span><span class="muted">${m.tier && m.tier !== "NONE" ? (m.tier === "WINNERS_BRACKET" ? "Playoffs" : "Consolation") : ""}</span></div>${sbSide(m, m.h, m.hp)}${sbSide(m, m.a, m.ap)}${wpChart(s, m, true)}</button>`).join("");

  // Standings snapshot with odds
  const rows = asOf(s, null).rows;
  const delta = (id) => (o && oi > 0 ? o.t[id].c[oi] - o.t[id].c[oi - 1] : 0);
  const table = `<div class="box scroll"><table class="compact"><thead><tr><th class="n">#</th><th>Team</th><th class="n">Record</th><th class="n">PF</th><th class="n">Title</th></tr></thead><tbody>
    ${rows.map((x, i) => { const d = delta(x.t.id); return `<tr class="${!s.done && i === s.playoffTeams - 1 ? "cut" : ""}"><td class="n">${s.done && x.t.final ? x.t.final : i + 1}</td><td>${teamCell(x.t)}</td><td class="n"><b>${recStr(x)}</b></td><td class="n">${f1(x.pf)}</td>
      <td class="n">${odd(x.t.id) != null ? `${pct1(odd(x.t.id))} <span class="${d > 0.5 ? "w" : d < -0.5 ? "l" : "muted"}">${d > 0.5 ? "▲" : d < -0.5 ? "▼" : ""}</span>` : "—"}</td></tr>`; }).join("")}
    </tbody></table></div>`;

  // Stars of the featured week (started players), and the worst bench call
  const sps = s.spans(wk), starts = [], benches = [];
  for (const sp of sps) for (const id in s.lineups[sp] || {}) for (const p of s.lineups[sp][id]) (p.slot === "BN" ? benches : p.slot === "IR" ? [] : starts).push({ p, t: s.byId[id] });
  const stars = starts.sort((a, b) => b.p.pts - a.p.pts).slice(0, 5);
  const blunder = benches.sort((a, b) => b.p.pts - a.p.pts)[0];
  const starList = stars.map((x) => `<li><span>${posTag(x.p.pos)}${pn(x.p.n)}<small class="ctx sub">${esc(x.t.name)}</small></span><span class="num">${f1(x.p.pts)}</span></li>`).join("");

  // Odds movers since the week before
  let movers = "";
  if (o && oi > 0) {
    const ms = s.teams.map((t) => ({ t, d: delta(t.id) })).sort((a, b) => b.d - a.d);
    const mv = (x) => `<li><span>${badge(x.t, 1)} ${esc(x.t.name)}<small class="ctx sub">${oddsReason(s, x.t.id, o.weeks[oi]) || ""}</small></span><span class="num ${x.d > 0 ? "w" : "l"}">${x.d > 0 ? "+" : "−"}${Math.round(Math.abs(x.d))}</span></li>`;
    movers = `<div class="box rec"><div class="k">Title Odds Movers <span class="muted" style="font-weight:500">· after week ${o.weeks[oi]}</span></div><ol class="swing">${ms.slice(0, 2).filter((x) => x.d > 0.5).map(mv).join("")}${ms.slice(-2).reverse().filter((x) => x.d < -0.5).map(mv).join("")}</ol><button class="morebtn" data-go="odds">See All Odds</button></div>`;
  }

  // Latest moves
  const latest = TX.slice(0, 6).map((x) => x.type === "trade"
    ? `<li><span><span class="pill gold">Trade</span> ${esc(x.s.byId[x.tr.teams[0]].name)} ⇄ ${esc(x.s.byId[x.tr.teams[1]].name)}<small class="ctx sub">${Object.entries(x.tr.got).map(([id, g]) => `${esc(x.s.byId[id].abbrev)} got ${g.map((p) => esc(p.split("|")[0])).join(", ")}`).join(" · ")}</small></span><span class="muted num">${x.y} wk ${x.tr.wk}</span></li>`
    : `<li><span>${badge(x.t, 1)} ${esc(x.t.name)}<small class="ctx sub">${x.m.add.map((p) => "+ " + esc(p.split("|")[0])).concat(x.m.drop.map((p) => "− " + esc(p.split("|")[0]))).join("  ")}</small></span><span class="muted num">${x.y} wk ${x.m.wk}</span></li>`).join("");

  // Defending champ and current favorite
  const prev = D.seasons.filter((x) => x.done).slice(-1)[0];
  const champ = prev && prev.teams.find((t) => t.final === 1);
  const fav = o ? [...s.teams].sort((a, b) => odd(b.id) - odd(a.id))[0] : rows[0].t;

  return `<div class="vhead"><div><div class="eyebrow">Buckaroo Bowl ${roman(n)} · ${s.year}</div><h2>${wkName}${anyLive ? ` <span class="pill live" style="vertical-align:middle">● Live</span>` : ""}</h2><p>Scores as of ${when}. ${anyLive ? "Live scores refresh about every hour during games." : ""}</p></div>
    <button class="morebtn" data-goweek="${s.year}|${wk}">All Lineups →</button></div>
  <div class="scoreboard">${scoreCards}</div>
  ${NEWS.length ? `<section style="margin:0 0 28px"><div class="vhead" style="margin-bottom:12px"><h3 style="margin:0">Top Stories</h3><button class="morebtn" data-go="news">All News →</button></div><div class="topstories">${newsCard(NEWS[0], true)}<div class="newslist">${NEWS.slice(1, 3).map((a) => newsCard(a)).join("")}</div></div></section>` : ""}
  <div class="homegrid">
    <section><h3>Standings</h3>${table}<p class="note">${s.done ? "Final standings." : `Dashed line marks the playoff cut. Title odds update after each finished week.`}</p></section>
    <div class="homeside">
      ${champ || fav ? `<div class="strip" style="margin:0">
        ${champ ? `<button class="box stat" data-go="trophies" style="text-align:left;cursor:pointer"><div class="k">Defending Champ</div><div class="v" style="font-size:19px">${esc(champ.name)}</div><div class="s">${mgrName(champ.mgr)} · Bowl ${roman(prev.year - D.firstYear + 1)}</div></button>` : ""}
        ${!s.done && fav ? `<button class="box stat" data-go="odds" style="text-align:left;cursor:pointer"><div class="k">Title Favorite</div><div class="v" style="font-size:19px">${esc(fav.name)}</div><div class="s">${mgrName(fav.mgr)}${odd(fav.id) != null ? ` · ${pct1(odd(fav.id))}` : ""}</div></button>` : ""}
      </div>` : ""}
      ${stars.length ? `<div class="box rec"><div class="k">Stars of ${wkName.startsWith("Week") ? wkName : "the Week"}</div><ol class="swing">${starList}</ol>${blunder && blunder.p.pts >= 10 ? `<div class="ctx">Bench blunder: ${pn(blunder.p.n)} scored ${f1(blunder.p.pts)} on ${esc(blunder.t.name)}'s bench.</div>` : ""}</div>` : ""}
      ${movers}
      ${allPosts().length ? `<div class="box rec"><div class="k">From the Feed</div><div class="feed">${allPosts().slice(0, 3).map((x) => postHtml(x.p, x.a)).join("")}</div><button class="morebtn" data-go="social">Open Social →</button></div>` : ""}
    </div>
  </div>
  <section><div class="vhead" style="margin-bottom:12px"><h3 style="margin:0">Latest Moves</h3><button class="morebtn" data-go="transactions">All Transactions →</button></div><div class="box rec"><ol class="swing">${latest}</ol></div></section>`;
}

// ---------- News & Social (written by Claude after each week, trade and season; see news.js) ----------
const ALL_NEWS = (D.news && D.news.articles) || [];
// Career profiles live on manager pages, not in the news feed (newest per manager)
const NEWS = ALL_NEWS.filter((a) => a.type !== "profile");
const PROFILE = {};
for (const a of ALL_NEWS) if (a.type === "profile" && a.mgr && !PROFILE[a.mgr]) PROFILE[a.mgr] = a;
const NEWS_TYPE = { recap: "Weekly Recap", trade: "Trade", review: "Season in Review" };
const newsWhen = (a) => (a.type === "review" ? `${a.year} Season` : a.type === "trade" ? `${a.year} · Before Week ${a.wk}` : `${a.year} · Week ${a.wk}`);
const newsCard = (a, big) => `<button class="box newscard${big ? " big" : ""}" data-go="news-${a.id}"><span class="pill${a.type === "trade" ? " gold" : ""}">${NEWS_TYPE[a.type]}</span><b>${esc(a.title)}</b><span class="dek">${esc(a.dek)}</span><small class="muted">${newsWhen(a)}</small></button>`;
const avatarHue = (handle) => [...handle].reduce((x, c) => (x * 31 + c.charCodeAt(0)) % 360, 7);
const postHtml = (p, a) => `<div class="post"><span class="avatar" style="--h:${avatarHue(p.handle)}" aria-hidden="true">${esc((p.author.match(/[A-Za-z0-9]/) || ["?"])[0].toUpperCase())}</span><div class="pbody"><div class="phead"><b>${esc(p.author)}</b> <span class="muted">${esc(p.handle.startsWith("@") ? p.handle : "@" + p.handle)}</span></div><p>${esc(p.text)}</p>${a ? `<button class="mlink postsrc" data-go="news-${a.id}">${newsWhen(a)} · ${esc(a.title)}</button>` : ""}</div></div>`;
const allPosts = () => NEWS.flatMap((a) => (a.social || []).map((p) => ({ p, a })));
const newsEmpty = `<div class="box lockcard"><h3>No Stories Yet</h3><p>League news is written automatically after every finished week, every trade and every season. Stories start appearing with the first update after the news writer is switched on.</p></div>`;
const aiNote = `<p class="note">Written by Claude, an AI, from the league's data. It can get things wrong; the scores and stats elsewhere on the site are the source of truth.</p>`;
// News and Social share one header with a News | Social switch
const newsHead = (which) => `<div class="vhead"><div><div class="eyebrow">Around the League</div><h2>News</h2><p>${which === "news" ? "Stories from the league's AI beat writer after every week, trade and season." : "What the (made-up) fans, pundits and insiders are saying. Tap a post's source to read the story behind it."}</p></div>
  <div class="tabs" role="tablist" style="margin:0"><button data-go="news" aria-current="${which === "news"}">News</button><button data-go="social" aria-current="${which === "social"}">Social</button></div></div>`;
function newsView() {
  const head = newsHead("news");
  if (!NEWS.length) return head + newsEmpty;
  const [lead, ...rest] = NEWS;
  return head + `<div class="newsgrid"><div class="newsmain">${newsCard(lead, true)}<div class="newslist">${rest.map((a) => newsCard(a)).join("")}</div></div>
    <aside><div class="box rec"><div class="k">From the Feed</div><div class="feed">${allPosts().slice(0, 6).map((x) => postHtml(x.p, x.a)).join("")}</div><button class="morebtn" data-go="social">Open Social →</button></div></aside></div>${aiNote}`;
}
function articleView() {
  const a = NEWS.find((x) => x.id === state.newsId);
  if (!a) return newsView();
  const i = NEWS.indexOf(a), newer = NEWS[i - 1], older = NEWS[i + 1];
  return `<article class="article"><button class="pill" data-go="news" style="border:0;cursor:pointer">← All News</button>
    <div class="eyebrow" style="margin-top:18px">${NEWS_TYPE[a.type]} · ${newsWhen(a)}</div><h2 class="headline">${esc(a.title)}</h2><p class="dek big">${esc(a.dek)}</p>
    <div class="artbody">${a.body.map((p) => `<p>${esc(p)}</p>`).join("")}</div>
    ${a.social && a.social.length ? `<section><h3>The Reaction</h3><div class="box rec"><div class="feed">${a.social.map((p) => postHtml(p)).join("")}</div></div></section>` : ""}
    ${aiNote}
    ${newer || older ? `<section><h3>More Stories</h3><div class="newslist">${[newer, older].filter(Boolean).map((x) => newsCard(x)).join("")}</div></section>` : ""}</article>`;
}
function socialView() {
  const posts = allPosts();
  return `${newsHead("social")}
    ${posts.length ? `<div class="box rec socialfeed"><div class="feed">${posts.map((x) => postHtml(x.p, x.a)).join("")}</div></div>${aiNote}` : newsEmpty}`;
}

// ---------- Odds page (top menu): one season at a time, newest first ----------
function oddsView() {
  const ys = years.filter((y) => S[y] && S[y].odds).reverse();
  const y = ys.includes(+state.oddsYear) ? +state.oddsYear : ys[0];
  state.oddsYear = y;
  return `<div class="vhead"><div><div class="eyebrow">Buckaroo Bowl ${roman(y - D.firstYear + 1)}</div><h2>Odds</h2><p>${S[y].done ? `How the ${y} race unfolded.` : `The ${y} race, updated after every finished week.`}</p></div>
    <div class="weekbar" style="margin:0">${ys.map((yy) => `<button data-oddsyear="${yy}" aria-current="${yy === y}">${yy}</button>`).join("")}</div></div>${oddsTab(S[y])}`;
}

// ---------- Render ----------
function render() {
  chrome();
  if (mapObj) { mapObj.remove(); mapObj = null; }
  const v = state.view;
  $("#app").innerHTML = v === "season" ? seasonView() : v === "mgr" ? mgrView() : v === "managers" ? managers() : v === "players" ? playersView() : v === "player" ? playerView() : v === "home" ? home() : v === "news" ? newsView() : v === "article" ? articleView() : v === "social" ? socialView() : v === "odds" ? oddsView() : v === "map" ? mapView() : v === "overrated" ? overratedView() : v === "transactions" ? txView() : v === "h2h" ? h2h() : v === "records" ? records() : trophies();
  document.title = "Buckaroo League History";
  if (v === "map") initMap();
  const cur = $(".yr[aria-current=true]"); if (cur) cur.scrollIntoView({ block: "nearest", inline: "nearest" });
}
$("#app").addEventListener("click", (e) => {
  const w = e.target.closest("[data-week]"); if (w) { state.week = +w.dataset.week; state.open = null; render(); return; }
  const mb = e.target.closest("[data-more]"); if (mb) { const open = mb.closest(".rec").classList.toggle("open"); mb.setAttribute("aria-expanded", open); mb.textContent = open ? "Show Top 10" : "Show Top " + (mb.closest(".rec").querySelectorAll("li").length + 1); return; }
  const o = e.target.closest("[data-open]"); if (o) { state.open = state.open === o.dataset.open ? null : o.dataset.open; render(); return; }
  const gw = e.target.closest("[data-goweek]"); if (gw) { const [y, w] = gw.dataset.goweek.split("|").map(Number); state.week = w; state.open = null; go(`${y}-weekly`); return; }
  const oy = e.target.closest("[data-oddsyear]"); if (oy) { state.oddsYear = +oy.dataset.oddsyear; state.oddsFocus = null; render(); return; }
  const ok = e.target.closest("[data-oddskey]"); if (ok) { state.oddsKey = ok.dataset.oddskey; render(); return; }
  const ot = e.target.closest("[data-oddsteam]"); if (ot) { state.oddsFocus = state.oddsFocus === +ot.dataset.oddsteam ? null : +ot.dataset.oddsteam; render(); return; }
  const my = e.target.closest("[data-mapyear]"); if (my) { state.mapYear = my.dataset.mapyear === "all" ? "all" : +my.dataset.mapyear; render(); return; }
  const by = e.target.closest("[data-bumyear]"); if (by) { state.bumYear = +by.dataset.bumyear; render(); return; }
  const r = e.target.closest("[data-roster]"); if (r) { state.rosterTeam = +r.dataset.roster; render(); }
});
$("#app").addEventListener("change", (e) => {
  const id = e.target.id;
  if (id === "moveTeam") { state.moveTeam = e.target.value; render(); }
  if (id === "rosterWeek") { state.rosterWeek = e.target.value; render(); }
  if (id === "standWeek") { state.standWeek = e.target.value; render(); }
  if (id === "ppos" || id === "psort") { state[id] = e.target.value; $("#plist").innerHTML = playerRows(); }
  if (id === "txy" || id === "txm" || id === "txt") { state[id] = e.target.value; $("#txlist").innerHTML = txRows(); }
});
// Search boxes update only their results so typing keeps focus
function oddsHover(e) {
  const wrap = e.target.closest && e.target.closest(".oddswrap");
  for (const w of document.querySelectorAll(".oddswrap")) if (w !== wrap) { const t = w.querySelector(".oddstip"); if (t) t.hidden = true; const l = w.querySelector(".hoverline"); if (l) l.style.display = "none"; }
  if (!wrap) return;
  const s = S[+wrap.dataset.y], key = wrap.dataset.key, o = s && s.odds;
  if (!o) return;
  const svg = wrap.querySelector("svg"), r = svg.getBoundingClientRect(), n = o.weeks.length;
  const vx = ((e.clientX - r.left) * OC.W) / r.width;
  const i = Math.max(0, Math.min(n - 1, Math.round(((vx - OC.L) / (OC.W - OC.L - OC.R)) * (n - 1))));
  const x = OC.L + (n === 1 ? 0 : (i * (OC.W - OC.L - OC.R)) / (n - 1));
  const line = svg.querySelector(".hoverline");
  line.setAttribute("x1", x); line.setAttribute("x2", x); line.style.display = "";
  const rows = [...s.teams].sort((a, b) => o.t[b.id][key][i] - o.t[a.id][key][i]);
  const tip = wrap.querySelector(".oddstip");
  tip.innerHTML = `<b>${wkLabel(s, o.weeks[i]) === "Draft" ? "Draft Day" : wkLabel(s, o.weeks[i])}</b>` + rows.map((t) => `<div class="${state.oddsFocus === t.id ? "sel" : ""}">${badge(t, 1)}<span>${esc(t.name)}</span><span class="num">${pct1(o.t[t.id][key][i])}</span></div>`).join("");
  tip.hidden = false;
  const px = ((x / OC.W) * r.width) + (r.left - wrap.getBoundingClientRect().left);
  const wW = wrap.clientWidth, tw = tip.offsetWidth;
  tip.style.left = Math.max(4, Math.min(wW - tw - 4, px > wW / 2 ? px - tw - 14 : px + 14)) + "px";
}
$("#app").addEventListener("pointermove", oddsHover);
$("#app").addEventListener("pointerdown", oddsHover);
document.addEventListener("pointerleave", () => oddsHover({ target: document.body }));
$("#app").addEventListener("input", (e) => {
  if (e.target.id === "pq") { state.pq = e.target.value; $("#plist").innerHTML = playerRows(); }
  if (e.target.id === "txq") { state.txq = e.target.value; $("#txlist").innerHTML = txRows(); }
});
window.addEventListener("popstate", (e) => { parseHash(); render(); window.scrollTo({ top: (e.state && e.state.scroll) || 0 }); });
// A hash typed or pasted by hand (no history state of ours)
window.addEventListener("hashchange", () => { if (!history.state) { parseHash(); render(); } });
parseHash(); render();
})();
</script>
